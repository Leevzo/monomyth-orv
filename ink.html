<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The wall. Scripts: this file, ink-core.js and palette333.js only. Never innerHTML with data: every
     word from a message, a snap or a door goes in through textContent. connect-src: the doors and the
     mailbox are https; http://127.0.0.1 is only for the fake mailbox in tests (§9). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Inkling">
<link rel="manifest" href="./ink.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<title>Inkling</title>
<link rel="stylesheet" href="./fonts.css">
<!--
  ink.html — THE PHONE GLASS of INKLING Phase 1. Orv lives here.
  The law is inkling/CONTRACT.md; where this file and the contract disagree, the contract wins.

  What it does, in order:
    1. Opens an invite (#ink=…) and keeps it under localStorage 'ink.<projectId>.*' — nothing else is
       ever written. The Sword's key box 'monomyth.focus.byok.v1' is READ for Orv's key, never written.
    2. Three panes on a native horizontal scroll-snap track (no JS swipe), opening on HOME:
         SCRIPT    the latest snap's script, each line in the ink of the hand that wrote it (§4)
         HOME      the constellation of tasks while writing, the sprite + scenes while filming (§2, §3);
                   below it Orv's corner: pick up to 3 stars, ask Orv, send an idea to the King (§7)
         MESSAGES  everything sent and received, newest last, each in its author's ink
    3. Roads (§5): the mailbox (only when the invite says mailbox:true) polls every 4 s; with it off,
       every send offers a sealed #m= link to hand over, and a paste box reads the King's links.
       A sent message waits in 'out' until a snap lists it as received; it is re-sent once an hour.

  The invite (made on the desk, POST /api/ink/invite; it holds keys, so it travels by hand only):
    {v:1, p, name, mid, member, color, key, room, topic, mailbox}
      p       project id                    mid     my member id (m1, m2…; the King's phone too)
      name    the inkling's name            member  my name, as the King wrote it
      color   my ink (THE 333 index)        key     my HMAC key (32 hex)
      room    room key (32 bytes b64url)    mailbox true = the King said yes to the mailbox (else off)
  Storage, all under 'ink.<p>.': invite · me {n,name,color,joined} · snap · log · out · talk · since · door · opened
  Test seam (§9): on a loopback page only, ?mailbox=http://127.0.0.1:<port> sets window.INK_MAILBOX.

  PERSONAL MODE (§12) is the default: no #ink= in the URL and no project open opens HIS KINGDOM.
    The Word Sword (left), the Constellation (right), Orv's corner (below). Storage under 'ink.me.':
      state {v:1, tasks:[{id, word, text, after, done, at, doneAt?}], one, n} · log (append-only) ·
      paid {door: at} (the doors opened by the word) · stash.<at> (a kingdom set aside by a restore).
    His words are logged verbatim BEFORE any model call. State changes ONLY through applyOp() on an op
    that checkOp() passed, from his hand (who:'k') or from Orv (who:'ai:<door>:<model>'). Nothing is
    ever deleted: "strike" marks done. With no usable key, Orv asks for one and the key is written into
    the Sword's box ('monomyth.focus.byok.v1', the same {apiKey, models, lists} shape _glass.js keeps).
    #seed=<b64url(deflate(json))> plants a prepared kingdom only into an empty one, never over one.
-->
<style>
/* Every value here comes from KNOBS in the script below (set as CSS variables at boot);
   these fallbacks are the same numbers, so the page reads right before the script runs. */
:root {
  --ground: #0a0a0a; --ink: #e6e6e6; --dim: #8c8c8c; --faint: #333333; --gold: #FFA512;
  --pad: 16px; --script: 15px; --orv-w: 82px; --orv-h: 100px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); color: var(--ink); }
body {
  display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  font: 16px/1.35 'W95FA', ui-monospace, monospace; -webkit-font-smoothing: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0 8px;
         min-height: 44px; min-width: 44px; cursor: pointer; text-align: left; }
button:disabled { color: var(--dim); cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 1px dotted var(--ink); outline-offset: 2px; }
textarea, input { font: 16px/1.35 'W95FA', ui-monospace, monospace; color: var(--ink); background: transparent;
                  border: 0; border-bottom: 1px solid var(--faint); border-radius: 0; width: 100%; padding: 6px 0;
                  resize: none; -webkit-appearance: none; appearance: none; }
textarea::placeholder, input::placeholder { color: var(--dim); }
p, ol { margin: 0; }
ol { list-style: none; padding: 0; }
[hidden] { display: none !important; }

/* labels: Dogica 8px tracked caps, grey (the machine's voice) */
.cue { font-family: 'Dogica', ui-monospace, monospace; font-size: 8px; line-height: 12px; letter-spacing: .2em;
       text-transform: uppercase; color: var(--dim); margin: 10px 0 4px; overflow-wrap: anywhere; }
.dim { color: var(--dim); }
.word { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }

/* the top seat: the three pane words (tap = jump) and the road's state */
#tabs { flex: 0 0 auto; display: flex; align-items: center; gap: 2px;
        padding: env(safe-area-inset-top) var(--pad) 0; border-bottom: 1px solid var(--faint); min-width: 0; }
#tabs button { color: var(--dim); }
#tabs button[aria-current="true"] { color: var(--ink); }
#road { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-family: 'Dogica', ui-monospace, monospace; font-size: 8px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }

/* the track: native scroll-snap does the swipe; the browser follows the thumb, we add no handler */
#track { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
         scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
#track::-webkit-scrollbar { display: none; }
.pane { flex: 0 0 100%; width: 100%; min-width: 0; height: 100%; overflow-x: hidden; overflow-y: auto;
        scroll-snap-align: start; scroll-snap-stop: always;
        padding: 4px var(--pad) calc(16px + env(safe-area-inset-bottom)); }

/* SCRIPT: Courier Prime, each line in its hand's ink */
#script p { font: var(--script)/1.3 'Courier Prime', 'Courier New', Courier, monospace; white-space: pre-wrap;
            overflow-wrap: anywhere; min-height: 1.3em; -webkit-font-smoothing: auto; }
#script p.ai::after { content: ' ai'; font-family: 'Dogica', monospace; font-size: 8px; letter-spacing: .2em; color: var(--dim); }

/* HOME: the sky above, Orv's corner below */
#pHome { display: flex; flex-direction: column; overflow: hidden; }
#upper { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
#oneWord { font-family: 'Dogica', ui-monospace, monospace; font-size: 24px; line-height: 32px; color: var(--gold); overflow-wrap: anywhere; }
#oneText { margin: 4px 0 8px; }
#sky { display: block; width: 100%; height: auto; max-width: 440px; margin: 0 auto; color: var(--ink); font-family: 'W95FA', monospace; }
#sprite { display: block; margin: 8px auto; image-rendering: pixelated; image-rendering: crisp-edges; }
#scenes li { padding: 2px 0; overflow-wrap: anywhere; }
#scenes li.shot { color: var(--ink); }
#scenes li.next { color: var(--gold); }
#scenes li.later { color: var(--dim); }
#corner { flex: 0 0 auto; max-height: 58%; overflow-y: auto; overflow-x: hidden; border-top: 1px solid var(--faint);
          display: grid; grid-template-columns: minmax(0, 1fr) var(--orv-w); gap: 8px; align-items: end; padding-top: 4px; }
#left { min-width: 0; }
#orv { padding: 0; min-width: var(--orv-w); align-self: end; }
#orvCv { display: block; width: var(--orv-w); height: var(--orv-h); image-rendering: pixelated; image-rendering: crisp-edges; }
#chips { display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; }
#chips button { padding: 0 6px; }
#convo { max-height: 26vh; overflow-y: auto; }
#convo li { margin: 4px 0; overflow-wrap: anywhere; }
#convo li.stage { color: var(--dim); font-style: italic; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-width: 0; }
#inks { display: grid; grid-template-columns: repeat(4, 44px); gap: 4px; margin: 6px 0; }
#inks button { padding: 0; display: flex; align-items: center; justify-content: center; }
#inks i { display: block; width: 24px; height: 24px; border-radius: 50%; }
#inks button.taken i { width: 8px; height: 8px; }
#inks button[aria-checked="true"] i { outline: 1px solid var(--ink); outline-offset: 3px; }
#linkOut { font-size: 12px; color: var(--dim); }

/* MESSAGES: a script page, not a chat — a cue in the author's ink, the words beneath */
#log li { margin: 0 0 12px; }
#log .text { white-space: pre-wrap; overflow-wrap: anywhere; }
#log li.road .text { text-decoration: underline dotted var(--dim); text-underline-offset: 4px; }
#recordLines li { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; margin: 2px 0; }
summary { list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
summary::-webkit-details-marker { display: none; }

/* ═══ PERSONAL MODE (§12): the Word Sword left, the Constellation right, Orv's corner below.
   Words float free on a grey ground; no boxes, no borders. The only gold is the crossguard. ═══ */
#me { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
      padding: env(safe-area-inset-top) var(--pad) calc(6px + env(safe-area-inset-bottom)); }
#meTop { flex: 0 0 auto; display: flex; align-items: center; min-width: 0; }
#meTop .cue { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#meShelf { margin-left: auto; display: flex; flex: 0 0 auto; }
.quiet { color: var(--dim); padding: 0 6px; }
#meShelfList { flex: 0 0 auto; padding: 0 0 8px; }
#meShelfList > button { display: block; }
#meMid { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; display: grid;
         grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 8px; align-items: start; }
#sword { min-width: 0; text-align: center; padding: 4px 0 12px; }
#sword button { display: block; width: 100%; text-align: center; padding: 0 2px; overflow-wrap: anywhere; }
#blade button { min-height: 30px; font-size: var(--blade); text-decoration: line-through; text-decoration-thickness: 1px; }
#guard { font-family: 'Dogica', ui-monospace, monospace; color: var(--gold); line-height: 1.3; padding: 8px 2px 2px; overflow: hidden; }
#guardLine { font-size: 12px; line-height: 1.3; color: var(--dim); margin: 0 0 6px; overflow-wrap: anywhere; }
#handle button { min-height: 36px; font-size: var(--handle); }
#sword #plus { color: var(--dim); font-size: 22px; }
#meSkyCol { min-width: 0; padding-top: 4px; }
#meCount { text-align: center; margin: 4px 0 0; }
#meSky { display: block; width: 100%; height: auto; color: var(--ink); font-family: 'W95FA', monospace; }
#meCorner { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) var(--orv-w); gap: 8px; align-items: end; padding-top: 6px; }
#meLeft { min-width: 0; }
#meSay { max-height: 22vh; overflow-y: auto; overflow-wrap: anywhere; margin: 0 0 4px; }
#meSay.stage { color: var(--dim); font-style: italic; }
#meKey p { color: var(--dim); }
#meNote { font-size: 13px; }
#menu { position: fixed; z-index: 10; max-width: calc(100vw - 2 * var(--pad)); padding: 6px 10px;
        background: var(--ground); box-shadow: 0 0 22px 18px var(--ground);
        display: flex; flex-direction: column; align-items: flex-start; }
#menu.form { width: min(320px, calc(100vw - 2 * var(--pad))); align-items: stretch; }
#menu .cue { margin: 0 0 2px; }
#menu .line { color: var(--dim); font-size: 13px; max-width: 230px; overflow-wrap: anywhere; margin: 0 0 4px; }
#menu button { min-height: 40px; }
</style>
</head>
<body>
<nav id="tabs" aria-label="panes">
  <button type="button" id="toMe">kingdom</button>
  <button type="button" data-pane="0">script</button>
  <button type="button" data-pane="1">home</button>
  <button type="button" data-pane="2">messages</button>
  <span id="road"></span>
</nav>

<main id="track">
  <section class="pane" id="pScript" aria-label="script">
    <p class="cue" id="scriptHead"></p>
    <div id="script"></div>
  </section>

  <section class="pane" id="pHome" aria-label="home">
    <div id="upper">
      <p class="cue"><button type="button" id="name" class="cue" style="margin:0;padding:0"></button></p>
      <p class="cue" id="oneLab">the one thing</p>
      <p id="oneWord"></p>
      <p id="oneText"></p>
      <svg id="sky" role="group" aria-label="the constellation of tasks"></svg>
      <p class="cue" id="count"></p>
      <div id="film" hidden>
        <canvas id="sprite" width="64" height="64"></canvas>
        <ol id="scenes"></ol>
      </div>
      <p id="wait" class="dim" hidden></p>
      <div id="emptyPaste" hidden></div>
    </div>
    <div id="corner">
      <div id="left">
        <div id="join" hidden>
          <p class="cue">who is holding this glass?</p>
          <input id="who" type="text" autocomplete="name" maxlength="60" aria-label="your name">
          <p class="cue">pick an ink</p>
          <div id="inks" role="radiogroup" aria-label="your ink"></div>
          <button type="button" id="joinBtn" class="word">join</button>
        </div>
        <div id="talk" hidden>
          <ol id="convo" aria-live="polite"></ol>
          <div id="chips"></div>
          <textarea id="words" rows="2" placeholder="say it" aria-label="your words"></textarea>
          <div class="row">
            <button type="button" id="askBtn" class="word">ask orv</button>
            <button type="button" id="sendBtn" class="word">send to the king</button>
            <span id="sendNote" class="dim"></span>
          </div>
        </div>
        <div id="handoff" hidden>
          <p class="cue">the mailbox is off — hand these to the king</p>
          <ol id="handList"></ol>
          <textarea id="linkOut" rows="2" readonly aria-label="the newest link"></textarea>
        </div>
      </div>
      <button type="button" id="orv" aria-label="ask Orv"><canvas id="orvCv" width="41" height="50"></canvas></button>
    </div>
  </section>

  <section class="pane" id="pMsgs" aria-label="messages">
    <p class="cue" id="snapNote"></p>
    <details id="record"><summary class="cue word">the record</summary><ol id="recordLines"></ol></details>
    <ol id="log"></ol>
    <div id="paste">
      <p class="cue">a link from the king</p>
      <textarea id="pasteIn" rows="2" placeholder="paste it here" aria-label="paste a link"></textarea>
      <div class="row"><button type="button" id="pasteBtn" class="word">read it</button><span id="pasteNote" class="dim"></span></div>
    </div>
  </section>
</main>

<main id="me" hidden aria-label="your kingdom">
  <header id="meTop">
    <p class="cue" id="meName"></p>
    <span id="meShelf">
      <button type="button" id="meProjects" class="quiet" aria-expanded="false">projects</button>
      <button type="button" id="meKeep" class="quiet">keep</button>
      <button type="button" id="meRestore" class="quiet">restore</button>
      <input type="file" id="meFile" accept=".json,application/json" hidden>
    </span>
  </header>
  <div id="meShelfList" hidden></div>
  <div id="meMid">
    <div id="sword" aria-label="the word sword">
      <ol id="blade" aria-label="the blade: done"></ol>
      <button type="button" id="guard" aria-label="the one thing"></button>
      <p id="guardLine"></p>
      <ol id="handle" aria-label="the handle: open"></ol>
      <button type="button" id="plus" aria-label="add a task by hand">+</button>
    </div>
    <div id="meSkyCol"><svg id="meSky" role="group" aria-label="the constellation of your tasks"></svg><p class="cue" id="meCount"></p></div>
  </div>
  <div id="meCorner">
    <div id="meLeft">
      <p id="meSay" aria-live="polite"></p>
      <div id="meKey" hidden>
        <p id="meKeyLine"></p>
        <div class="row" style="flex-wrap:nowrap">
          <input id="meKeyIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Orv's key">
          <button type="button" id="meKeySave" class="word">keep</button>
        </div>
      </div>
      <textarea id="meWords" rows="2" placeholder="tell orv" aria-label="your words to Orv"></textarea>
      <div class="row"><button type="button" id="meSpeak" class="word">speak</button><span id="meNote" class="dim"></span></div>
    </div>
    <div id="meOrvSeat"></div>
  </div>
  <div id="menu" role="dialog" aria-label="this word" hidden></div>
</main>

<script src="./palette333.js"></script>
<script src="./ink-core.js"></script>
<script>
'use strict';
/* ═══ KNOBS — every tunable value in one place (CONTRACT §8) ═══ */
const KNOBS = {
  ground: '#0a0a0a', ink: '#e6e6e6', dim: '#8c8c8c', faint: '#333333',   // greys only, R=G=B; dark so all 12 inks read
  pad: 16,                              // side gutter, px
  scriptPx: 15,                         // Courier Prime size on the phone
  orvSprite: 'orv/orv2.json',           // the one Orv (41×50, four idle poses); never redrawn here
  orvScale: 2,                          // integer scale only: 82×100
  orvBeat: [1400, 520, 130, 190],       // ms each idle pose holds (the ruled BEAT)
  spriteMaxScale: 8,                    // the inkling's sprite: the biggest integer scale that fits, up to this
  freeDoors: ['groq', 'gemini'],        // doors with a free tier; every other door waits for the word
  password: 'Cha-ching',                // the literal word that opens a paid door, once per ask (§8)
  orvTokens: 300,                       // Orv is succinct
  orvTimeoutMs: 45000,
  resendMs: 60 * 60 * 1000,             // an unacknowledged message is re-sent once an hour (§5)
  resendCheckMs: 30 * 1000,             // how often we look for one that is due (an unsent one is due at once)
  roadMs: 2000,                         // how often the road's state word is refreshed
  logMax: 1000,                         // this phone's list only; the record itself lives on the Throne
  talkMax: 60,                          // Orv's lines kept on this phone
  nameMax: 60,
  chipMax: 14,                          // characters of a word on a chip or in a cue
  me: {                                 // PERSONAL MODE (§12)
    look: { ground: '#454545', ink: '#EDEDED', dim: '#A6A6A6', faint: '#5C5C5C' },   // a grey ground, greys only (R=G=B)
    title: 'the kingdom',
    carrying: 'the King’s own kingdom',  // the hot context's "You are carrying …" line
    hello: '(Orv sits in the corner, one eye on you.)',
    keyLine: 'Orv needs a key — paste it here',
    sky: { cols: 3, dx: 58, dy: 66, pad: 22, arc: [0, 8, 0], r: 6, ring: 11, mark: 9, hit: 22, labelDy: 20, labelMax: 9, font: 13 },
    guardPx: [32, 24, 16],              // the crossguard: the largest of these that fits (Dogica is pixels: multiples of 8)
    bladePx: 14, handlePx: 16,          // blade and handle words; both below the crossguard's smallest
    wordMax: 16, lineMax: 140, sayMax: 600, opsMax: 12, afterMax: 8, tasksMax: 2000,
    rawMax: 2000,                       // characters of an unparsed reply kept in the log
    idsMax: 1200,                       // characters of the id list in Orv's system words
    tokens: 700,                        // a say plus twelve ops needs more room than a chat line
    fast: ['instant', 'flash-lite', 'flash', 'haiku', 'mini', 'fast', 'lite', 'small', '8b'],   // name hints, in order, for a fast default
    notChat: /whisper|tts|embed|guard|image|vision|audio|realtime|transcri|search|compound|moderation|dall-e|sora|codex|playai/i,
    rule: 'Answer ONLY with one JSON object and nothing else: {"say":"…","ops":[…]}. ' +
      '"say": at most 600 characters, in your voice, plain words. ' +
      '"ops": what his words change, in order, at most 12, chosen ONLY from: ' +
      '{"op":"add","word":"OneWord","text":"the task, at most 140 characters","after":["<id>"]} (after is optional) · ' +
      '{"op":"done","id":"<id>"} · {"op":"undone","id":"<id>"} · {"op":"link","a":"<id>","b":"<id>"} (b comes after a) · ' +
      '{"op":"one","id":"<id>"} (sets THE ONE THING) · {"op":"edit","id":"<id>","word":"…","text":"…"}. ' +
      'A word is ONE word of at most 16 characters. Use only the ids above; tasks you add take the next ids in order: {next}. ' +
      'Nothing is ever deleted. If his words name no deed, "ops" is [].'
  }
};
const BOX = 'monomyth.focus.byok.v1';   // the Sword's key box: read for Orv's key; personal mode writes a pasted key into it (same shape as _glass.js)
/* the doors, found by the key's stamp (the same stamps as _glass.js). URLs only: the door names its
   own models (§7), so there is no model id anywhere in this file. */
const DOORS = {
  groq:       { list: 'https://api.groq.com/openai/v1/models',       chat: 'https://api.groq.com/openai/v1/chat/completions' },
  openrouter: { list: 'https://openrouter.ai/api/v1/models',         chat: 'https://openrouter.ai/api/v1/chat/completions' },
  xai:        { list: 'https://api.x.ai/v1/models',                  chat: 'https://api.x.ai/v1/chat/completions' },
  openai:     { list: 'https://api.openai.com/v1/models',            chat: 'https://api.openai.com/v1/chat/completions' },
  anthropic:  { list: 'https://api.anthropic.com/v1/models?limit=100', chat: 'https://api.anthropic.com/v1/messages' },
  gemini:     { list: 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', chat: 'https://generativelanguage.googleapis.com/v1beta/models/' }
};

/* tests only (§9): a loopback page may point the road at a fake mailbox. On github.io this never fires. */
(function seam() {
  if (!/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) return;
  const m = new URLSearchParams(location.search).get('mailbox');
  if (m && /^http:\/\/127\.0\.0\.1:\d{2,5}$/.test(m)) window.INK_MAILBOX = m;
})();

const $ = id => document.getElementById(id);
const show = (id, on) => $(id).toggleAttribute('hidden', !on);   // an attribute, so it works on <svg> too
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
const clip = (s, n) => { const a = Array.from(String(s)); return a.length <= n ? String(s) : a.slice(0, n - 1).join('') + '…'; };
const iso = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
function when(at) {
  const d = new Date(at), p = n => String(n).padStart(2, '0');
  return isNaN(d) ? '' : p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ═══ STORAGE — every key this page writes is 'ink.<project id>.<name>' ═══ */
let P = null;                                                   // the open project's id
const okId = s => typeof s === 'string' && /^[a-z0-9][a-z0-9-]{0,63}$/.test(s);
function getFor(p, name, dflt) {
  try { const v = localStorage.getItem('ink.' + p + '.' + name); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; }
}
const get = (name, dflt) => getFor(P, name, dflt);
function put(name, v) {
  if (!okId(P)) return;
  try { localStorage.setItem('ink.' + P + '.' + name, JSON.stringify(v)); } catch (e) { S.note = 'this phone would not keep that (' + (e.message || e) + ')'; }
}
function projects() {                                           // every inkling this glass holds, most recently opened first
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) { const m = /^ink\.([a-z0-9][a-z0-9-]*)\.invite$/.exec(localStorage.key(i) || ''); if (m) out.push(m[1]); } } catch (e) { /* storage shut */ }
  return out.sort((a, b) => getFor(b, 'opened', 0) - getFor(a, 'opened', 0));
}
function readBox() { try { return JSON.parse(localStorage.getItem(BOX) || '{}') || {}; } catch (e) { return {}; } }

/* ═══ STATE — everything shown derives from these, and these from recorded facts ═══ */
const S = { inv: null, me: null, snap: null, log: [], out: [], talk: [], sel: [], box: null, sky: null, pick: null, note: '', scriptN: -1, linkFor: '' };
const snapBody = () => (S.snap ? S.snap.snap : null);
const mailboxOn = () => !!(S.inv && S.inv.mailbox === true);
function member(id) { const s = snapBody(); return (s && (s.members || []).find(m => m.id === id)) || null; }
function inkOf(id) {
  if (id === 'k') return INK.hex(INK.KING);
  const m = member(id);
  if (id === S.inv.mid) return INK.hex(m && !S.out.some(o => o.kind === 'color') ? m.color : S.me.color) || KNOBS.ink;
  return (m && INK.hex(m.color)) || KNOBS.dim;
}
function nameOf(id) {
  if (id === S.inv.mid) return S.me.name || S.inv.member || id;
  const m = member(id);
  return m ? m.name : id === 'k' ? 'the King' : id;
}

/* an invite is checked field by field before it is kept; anything off and it is refused whole */
function inviteOk(v) {
  if (!v || typeof v !== 'object' || v.v !== 1 || !okId(v.p) || v.p === 'me') return false;   // 'ink.me.*' is his kingdom, never a project
  if (typeof v.mid !== 'string' || !/^m[1-9][0-9]*$/.test(v.mid)) return false;
  if (typeof v.key !== 'string' || !/^[0-9a-f]{32}$/.test(v.key)) return false;
  try { if (INK.unb64url(v.room).length !== 32) return false; } catch (e) { return false; }
  return true;
}
function adopt(v) {
  if (!inviteOk(v)) return false;
  const old = getFor(v.p, 'invite', null);
  P = v.p;
  const inv = { v: 1, p: v.p, name: String(v.name || v.p), mid: v.mid, member: clip(String(v.member || ''), KNOBS.nameMax),
                color: INK.INKS.includes(v.color) ? v.color : INK.INKS[0], key: v.key, room: v.room, mailbox: v.mailbox === true };
  put('invite', inv);
  if (!old || old.mid !== inv.mid || !get('me', null)) {        // a new hand on this glass starts its own count
    put('me', { n: 0, name: inv.member, color: inv.color, joined: false });
    put('out', []);
  }
  return true;
}

/* ═══ OPEN A PROJECT ═══ */
function enter(p) {
  closeMenu(); showMode(false);
  if (S.box) S.box.stop();
  P = p;
  S.inv = get('invite', null); S.me = get('me', { n: 0, name: '', color: INK.INKS[0], joined: false });
  S.snap = get('snap', null); S.log = get('log', []); S.out = get('out', []); S.talk = get('talk', []);
  S.sel = []; S.box = null; S.pick = null; S.scriptN = -1; S.linkFor = '';
  if (S.sky) { S.sky.selected = []; }
  put('opened', Date.now());
  render();
  startRoad();
}

/* ═══ THE ROADS (§5) ═══ */
async function startRoad() {
  if (!mailboxOn()) return;
  const top = await INK.topic(S.inv.room, P);                   // always computed, never taken on trust
  S.box = INK.mailbox(top);
  S.box.since = get('since', S.box.since);
  S.box.start(async body => { await takeBody(body); put('since', S.box.since); });
}
async function push(o) {                                        // one sealed body onto the mailbox
  if (!S.box || o.busy) return false;
  o.busy = true;
  try { await S.box.publish(o.body, o.id); o.sentAt = Date.now(); S.note = ''; return true; }
  catch (e) { S.note = 'the mailbox did not take it (' + (e.message || e) + ')'; return false; }
  finally { o.busy = false; put('out', S.out.map(x => ({ id: x.id, kind: x.kind, body: x.body, sentAt: x.sentAt }))); renderRoad(); }
}
function resendDue() {
  if (!S.box) return;
  const now = Date.now();
  S.out.filter(o => now - (o.sentAt || 0) >= KNOBS.resendMs).forEach(push);
}

/* a sealed body from the mailbox or a pasted link: opened under the room key, or dropped */
async function takeBody(body) {
  let msg = await INK.open(S.inv.room, body);
  if (!msg) {                                                   // perhaps it belongs to another inkling on this glass
    for (const p of projects()) {
      if (p === P) continue;
      const inv = getFor(p, 'invite', null);
      if (inv && (msg = await INK.open(inv.room, body))) { if (msg.p === p) { enter(p); break; } msg = null; }
    }
  }
  if (msg) await handle(msg);
  return !!msg;
}
const looksRight = m => !!m && typeof m === 'object' && m.v === 1 && m.p === P && typeof m.from === 'string' &&
  /^(k|m[1-9][0-9]*)$/.test(m.from) && Number.isSafeInteger(m.n) && m.n > 0 && typeof m.k === 'string' &&
  typeof m.text === 'string' && Array.isArray(m.tasks) && typeof m.at === 'string';

async function handle(msg) {
  if (!looksRight(msg)) return;
  if (msg.from === 'k') {
    if (!(await INK.verifyMessage(msg))) return;               // Phase 1: the King is trusted on the room key (§5)
    if (msg.k === 'snap') return takeSnap(msg);
    return addLog(entryOf(msg, false));
  }
  if (msg.from === S.inv.mid) {                                 // my own message, back from the road
    if (await INK.verifyMessage(msg, S.inv.key)) bumpN(msg.n);
    return;
  }
  addLog(entryOf(msg, false));                                  // another hand: unconfirmed until a snap lists it
}
function bumpN(n) { if (n > S.me.n) { S.me.n = n; put('me', S.me); } }

function takeSnap(msg) {
  const s = msg.snap;
  if (!s || typeof s !== 'object' || !s.project || s.project.id !== P || !Array.isArray(s.tasks) || !Array.isArray(s.members)) return;
  if (S.snap && S.snap.n >= msg.n) return;                       // an older snap changes nothing
  S.snap = { n: msg.n, at: msg.at, snap: s };
  put('snap', S.snap);
  const got = new Set(Array.isArray(s.received) ? s.received.map(String) : []);
  S.out = S.out.filter(o => !got.has(o.id));
  put('out', S.out.map(x => ({ id: x.id, kind: x.kind, body: x.body, sentAt: x.sentAt })));
  S.log.forEach(e => { if (got.has(e.id)) e.acked = true; });
  put('log', S.log);
  got.forEach(id => { const m = /^(m[1-9][0-9]*):([0-9]+)$/.exec(id); if (m && m[1] === S.inv.mid) bumpN(+m[2]); });
  render();
}

function entryOf(msg, mine) {
  return { id: msg.from + ':' + msg.n, from: msg.from, k: msg.k, at: msg.at, text: msg.text, tasks: msg.tasks.slice(0, 3).map(String),
           ai: typeof msg.ai === 'string' ? msg.ai : '', c: Number.isInteger(msg.c) ? msg.c : null, mine: !!mine, acked: msg.from === 'k' };
}
function addLog(e) {
  if (S.log.some(x => x.id === e.id)) return;
  S.log.push(e);
  while (S.log.length > KNOBS.logMax) S.log.shift();
  put('log', S.log);
  renderMessages(true);
}

/* sign, seal, keep in 'out', then the mailbox — or, with it off, a link to hand over */
async function send(kind, tasks, text, more) {
  const who = { p: P, from: S.inv.mid, key: S.inv.key, n: S.me.n };
  const msg = await INK.makeMessage(who, kind, tasks, text, more);
  S.me.n = who.n; put('me', S.me);                              // kept before anything can fail: an n is never reused
  const o = { id: msg.from + ':' + msg.n, kind, body: await INK.seal(S.inv.room, msg), sentAt: 0 };
  S.out.push(o);
  put('out', S.out.map(x => ({ id: x.id, kind: x.kind, body: x.body, sentAt: x.sentAt })));
  addLog(entryOf(msg, true));
  if (S.box) await push(o);
  render();
  return o;
}

/* ═══ LINKS BY HAND ═══ */
async function copyLink(o) {
  const url = await INK.messageLink(o.body);
  const ta = $('linkOut'); ta.value = url; S.linkFor = o.id;
  try { await navigator.clipboard.writeText(url); return 'copied'; }
  catch (e) { ta.focus(); ta.select(); return 'selected — copy it'; }
}
async function shareLink(o) {
  const url = await INK.messageLink(o.body);
  if (navigator.share) { try { await navigator.share({ url }); return 'shared'; } catch (e) { return ''; } }
  return copyLink(o);
}
async function readPasted(text, noteEl) {
  const got = await INK.readLink(text);
  if (!got) { noteEl.textContent = 'that is not an inkling link'; return; }
  if (got.ink) {
    if (!adopt(got.ink)) { noteEl.textContent = 'that invite is not whole'; return; }
    noteEl.textContent = 'welcome'; enter(P); return;
  }
  if (!S.inv) { noteEl.textContent = 'open the invite first'; return; }
  noteEl.textContent = (await takeBody(got.m)) ? 'read' : 'this glass has no key for that link';
}

/* ═══ ORV (§7) ═══ */
function doorOf(k) {
  k = String(k || '').trim();
  if (k.startsWith('gsk_')) return 'groq'; if (k.startsWith('sk-ant-')) return 'anthropic'; if (k.startsWith('sk-or-')) return 'openrouter';
  if (k.startsWith('xai-')) return 'xai'; if (k.startsWith('AIza') || k.startsWith('AQ.')) return 'gemini'; if (k.startsWith('sk-')) return 'openai';
  return 'unknown';
}
function fetchT(url, init) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), KNOBS.orvTimeoutMs);
  return fetch(url, Object.assign({}, init, { signal: c.signal, referrerPolicy: 'no-referrer' })).finally(() => clearTimeout(t));
}
function headers(d, key) {
  if (d === 'anthropic') return { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
  if (d === 'gemini') return { 'content-type': 'application/json', 'x-goog-api-key': key };
  return { 'content-type': 'application/json', authorization: 'Bearer ' + key };
}
async function listModels(d, key) {
  const o = await (await fetchT(DOORS[d].list, { headers: headers(d, key) })).json();
  if (d === 'gemini') return (o.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => String(m.name || '').replace(/^models\//, '')).filter(id => id && !/embedding|imagen|veo|tts|audio|image|live|native/i.test(id));
  return (o.data || []).map(m => String(m.id)).filter(id => !/whisper|tts|embed|guard|image/i.test(id));
}
async function pickModel(d, key) {                              // the box's own pick first, then the door's first
  const b = readBox();
  const named = String(((b.models || {})[d]) || '').trim() || String((((b.lists || {})[d]) || {}).pick || '');
  if (named) return named;
  const kept = get('door', {});
  if (kept[d]) return kept[d];
  const ids = await listModels(d, key);
  if (!ids.length) throw new Error('that door listed no models');
  kept[d] = ids[0]; put('door', kept);
  return ids[0];
}
async function talk(d, key, model, prompt) {
  const H = headers(d, key);
  if (d === 'anthropic') {
    const r = await fetchT(DOORS[d].chat, { method: 'POST', headers: H, body: JSON.stringify({ model, max_tokens: KNOBS.orvTokens, messages: [{ role: 'user', content: prompt }] }) });
    const o = await r.json(); if (!r.ok) throw new Error((o.error && o.error.message) || r.statusText);
    return (o.content || []).map(c => c.text || '').join('');
  }
  if (d === 'gemini') {
    const r = await fetchT(DOORS[d].chat + encodeURIComponent(model) + ':generateContent', { method: 'POST', headers: H,
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: KNOBS.orvTokens } }) });
    const o = await r.json(); if (!r.ok) throw new Error((o.error && o.error.message) || r.statusText);
    const c = ((o.candidates || [])[0] || {}).content;
    return ((c && c.parts) || []).map(x => x.text || '').join('');
  }
  const r = await fetchT(DOORS[d].chat, { method: 'POST', headers: H, body: JSON.stringify({ model, max_tokens: KNOBS.orvTokens, messages: [{ role: 'user', content: prompt }] }) });
  const o = await r.json(); if (!r.ok) throw new Error((o.error && o.error.message) || r.statusText);
  return (((o.choices || [])[0] || {}).message || {}).content || '';
}
/* no key: one plain stage direction, from the state, and nothing else */
function stage() {
  const s = snapBody(), tasks = s ? s.tasks : [];
  const words = S.sel.map(id => tasks.find(t => t.id === id)).filter(Boolean).map(t => t.word);
  if (words.length) return '(No key in the box. Orv points at ' + words.join(', ') + '.)';
  if (s && s.project.phase === 'filming') {
    const next = (s.scenes || []).find(x => !x.shot);
    if (next) return '(No key in the box. Orv points at the next scene: ' + next.heading + '.)';
  }
  const one = INK.oneThing(tasks);
  return one ? '(No key in the box. Orv taps the ringed star, ' + one.word + '.)' : '(No key in the box. Orv waits.)';
}
function pushTalk(line) {
  S.talk.push(Object.assign({ at: iso() }, line));
  while (S.talk.length > KNOBS.talkMax) S.talk.shift();
  put('talk', S.talk);
  renderTalk();
}
let asking = false;
async function askOrv() {
  if (asking || !S.inv) return;
  const words = $('words').value.trim(), s = snapBody();
  if (words) pushTalk({ who: 'me', text: words });
  const key = String(readBox().apiKey || '').trim();
  if (!key) return pushTalk({ who: 'orv', stage: true, text: stage() });
  const d = doorOf(key);
  if (!DOORS[d]) return pushTalk({ who: 'orv', stage: true, text: '(Orv squints at the key. No door answers to that stamp.)' });
  if (!KNOBS.freeDoors.includes(d) && words.indexOf(KNOBS.password) < 0)
    return pushTalk({ who: 'orv', stage: true, text: '(The ' + d + ' door costs coin. Orv holds out his gear hand and waits for the word ' + KNOBS.password + '.)' });
  const hot = INK.hotContext({ name: s ? s.project.name : S.inv.name, seed: s ? s.project.seed : '', tasks: s ? s.tasks : [],
                              scenes: s ? s.scenes : [], selected: S.sel, words });
  asking = true; $('askBtn').disabled = true; $('askBtn').textContent = 'orv is reading';
  try {
    const model = await pickModel(d, key);
    const text = String(await talk(d, key, model, hot)).trim();
    pushTalk({ who: 'orv', text: text || '(Orv shrugs.)', door: d, model, stage: !text });
  } catch (e) {
    pushTalk({ who: 'orv', stage: true, text: '(The ' + d + ' door did not answer: ' + (e.message || e) + ')' });
  } finally { asking = false; $('askBtn').disabled = false; $('askBtn').textContent = 'ask orv'; }
}
const aiMark = l => { const m = l.door + (l.model ? ':' + l.model : ''); return m.length <= 80 && /^[^:\s]+(:\S+)?$/.test(m) ? m : l.door; };

/* Orv himself: the one sprite, four idle poses, integer scale, never stretched or redrawn */
async function orvBoot() {
  const cv = $('orvCv'), cx = cv.getContext('2d');
  let O;
  try { O = await (await fetch(KNOBS.orvSprite)).json(); } catch (e) { return; }
  cv.width = O.w; cv.height = O.h;
  cv.style.width = O.w * KNOBS.orvScale + 'px'; cv.style.height = O.h * KNOBS.orvScale + 'px';
  const paint = f => {
    cx.clearRect(0, 0, O.w, O.h);
    const rows = O.frames[f];
    for (let y = 0; y < O.h; y++) for (let x = 0; x < O.w; x++) { const h = O.pal[rows[y][x]]; if (h) { cx.fillStyle = h; cx.fillRect(x, y, 1, 1); } }
  };
  let f = 0;
  paint(0);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const beat = () => { f = (f + 1) % O.frames.length; paint(f); setTimeout(beat, KNOBS.orvBeat[f % KNOBS.orvBeat.length]); };
  setTimeout(beat, KNOBS.orvBeat[0]);
}

/* ═══ DRAWING ═══ */
const PANES = ['pScript', 'pHome', 'pMsgs'];
const paneNow = () => { const t = $('track'); return Math.round(t.scrollLeft / Math.max(1, t.clientWidth)); };
function renderTabs() {
  const i = paneNow();
  document.querySelectorAll('#tabs button[data-pane]').forEach(b => b.setAttribute('aria-current', String(+b.dataset.pane === i)));
}
function renderRoad() {
  const r = $('road');
  if (!S.inv) { r.textContent = ''; return; }
  const waiting = S.out.length ? ' · ' + S.out.length + ' waiting' : '';
  r.textContent = S.note ? S.note : mailboxOn() ? (S.box && S.box.error ? 'mailbox silent' : 'mailbox') + waiting : 'by hand' + waiting;
}
function render() { renderTabs(); renderRoad(); renderHome(); renderMessages(false); if (S.scriptN !== (S.snap ? S.snap.n : 0)) renderScript(); }

function renderScript() {
  const box = $('script'), s = snapBody();
  box.textContent = '';
  S.scriptN = S.snap ? S.snap.n : 0;
  if (!s || typeof s.script !== 'string') { $('scriptHead').textContent = S.inv ? 'the script arrives with the desk’s snapshot' : ''; return; }
  $('scriptHead').textContent = String(s.project.script || s.project.name) + ' · as of ' + when(S.snap.at);
  const hands = new Map((Array.isArray(s.hands) ? s.hands : []).filter(h => Array.isArray(h) && h.length >= 3).map(h => [h[0], h]));
  const king = INK.hex(INK.KING), frag = document.createDocumentFragment();
  s.script.split('\n').forEach((line, i) => {
    const p = mk('p', null, line), h = hands.get(i);
    if (h && h[1] === 'ai') { p.className = 'ai'; p.style.color = KNOBS.dim; }   // an accepted Orv heading: grey, marked ai (§4)
    else p.style.color = (h && INK.hex(h[2])) || king;                          // a member's kept line in their ink; the rest the King's
    frag.appendChild(p);
  });
  box.appendChild(frag);
}

function renderHome() {
  const s = snapBody(), joined = !!(S.me && S.me.joined);
  $('corner').hidden = !S.inv;
  $('emptyPaste').hidden = !!S.inv;
  const all = projects();
  $('name').textContent = S.inv ? (s ? s.project.name : S.inv.name) + (all.length > 1 ? ' ›' : '') : 'inkling';
  $('name').disabled = all.length < 2;
  if (!S.inv) {
    ['oneLab', 'oneWord', 'oneText', 'sky', 'count', 'film'].forEach(id => show(id, false));
    $('wait').hidden = false;
    $('wait').textContent = 'This glass holds no inkling yet. Paste the invite link the King sent you.';
    if (!$('emptyPaste').firstChild) $('emptyPaste').appendChild(pasteBox());
    return;
  }
  const filming = !!(s && s.project.phase === 'filming');
  $('wait').hidden = !!s;
  $('wait').textContent = mailboxOn() ? 'No word from the desk yet. The King’s snapshot will land here.'
                                      : 'No word from the desk yet. Paste the King’s link in messages.';
  ['oneLab', 'oneWord', 'oneText', 'count'].forEach(id => show(id, !!s));
  show('sky', !!s && !filming);
  show('film', filming);
  if (s && !filming) {
    const one = INK.oneThing(s.tasks), done = s.tasks.filter(t => t.done).length;
    $('oneLab').textContent = 'the one thing';
    $('oneWord').textContent = one ? one.word : s.tasks.length ? 'every task is done' : 'no tasks yet';
    $('oneText').textContent = one ? one.text : s.tasks.length ? 'Filming may begin when the King says so.' : '';
    $('count').textContent = done + ' of ' + s.tasks.length + ' tasks done';
    if (!S.sky) S.sky = INK.drawSky($('sky'), s.tasks, s.members, { selected: S.sel, onSelect: ids => { S.sel = ids; renderChips(); } });
    else S.sky.draw(s.tasks, s.members);
    S.sel = S.sky.selected.slice();
  }
  if (filming) {
    const scenes = Array.isArray(s.scenes) ? s.scenes : [], shot = scenes.filter(x => x.shot).length;
    const next = scenes.find(x => !x.shot);
    $('oneLab').textContent = 'the next scene';
    $('oneWord').textContent = next ? next.heading : 'every scene is shot';
    $('oneText').textContent = '';
    $('count').textContent = shot + ' of ' + scenes.length + ' scenes shot';
    const cv = $('sprite');
    if (s.sprite && Array.isArray(s.sprite.cells) && s.sprite.cells.length) {
      const cells = INK.mosaic(s.sprite.cells, INK.level(shot, scenes.length));   // derived from the shot count by §3's rule
      const fit = Math.floor(($('upper').clientWidth || 300) / cells.length);
      INK.drawSprite(cv, cells, Math.max(1, Math.min(KNOBS.spriteMaxScale, fit)));
      cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px'; cv.hidden = false;
    } else cv.hidden = true;
    const ol = $('scenes'); ol.textContent = '';
    if (!s.sprite) ol.appendChild(mk('li', 'later', 'The Sampo is asleep: no sprite yet.'));
    scenes.forEach(x => ol.appendChild(mk('li', x.shot ? 'shot' : x === next ? 'next' : 'later', (x.shot ? '✓ ' : '  ') + x.heading)));
  }
  $('join').hidden = joined;
  $('talk').hidden = !joined;
  $('sendNote').textContent = !S.out.length ? '' : mailboxOn() ? 'on the road' : 'hand the links below to the King';   // derived from 'out', never stale
  if (!joined) renderJoin(); else { renderChips(); renderTalk(); }
  renderHandoff();
}

function renderJoin() {
  const who = $('who');

/* ═══ PERSONAL MODE (§12): his own kingdom ═══════════════════════════════════════════════════════
   The ONLY ways his state changes: applyOp() on an op that checkOp() passed — from his hand (logged
   who:'k') or from Orv's JSON (logged who:'ai:<door>:<model>'). The log only ever grows. */
const ME = { on: false, st: null, menu: null, say: null, busy: false, note: '', sky: null };
const meKey = k => 'ink.me.' + k;
function meGet(k, d) { try { const v = localStorage.getItem(meKey(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function mePut(k, v) {
  try { localStorage.setItem(meKey(k), JSON.stringify(v)); return true; }
  catch (e) { ME.note = 'this phone would not keep that (' + (e.message || e) + ')'; return false; }
}
const isoMs = () => new Date().toISOString();
function logIt(e) {                                              // append-only: read fresh, add one, write back
  const old = meGet('log', []), list = Array.isArray(old) ? old : [], last = list[list.length - 1];
  list.push(Object.assign({ n: (last && Number.isSafeInteger(last.n) ? last.n : list.length) + 1, at: isoMs() }, e));
  return mePut('log', list);
}
const nOf = id => parseInt(String(id).slice(1), 36) || 0;
const len = s => Array.from(String(s)).length;
const emptyState = () => ({ v: 1, tasks: [], one: null, n: 0 });
const isEmpty = s => !s || !Array.isArray(s.tasks) || !s.tasks.length;

/* the limits, shared by his hand and Orv's ops */
function wordBad(w) {
  if (typeof w !== 'string') return 'the word is not text';
  const v = w.trim();
  return !v ? 'the word is empty' : /\s/.test(v) ? 'one word only' : len(v) > KNOBS.me.wordMax ? 'the word is over ' + KNOBS.me.wordMax + ' characters' : '';
}
function textBad(x) {
  if (typeof x !== 'string') return 'the line is not text';
  const v = x.trim();
  return !v ? 'the line is empty' : len(v) > KNOBS.me.lineMax ? 'the line is over ' + KNOBS.me.lineMax + ' characters' : '';
}

/* a stored, seeded or restored kingdom, checked whole; anything off and it is refused (null) */
function cleanState(s) {
  if (!s || typeof s !== 'object') return null;
  if (s.keys && typeof s.keys === 'object') s = s.keys[meKey('state')];     // a "keep" file
  else if (s.state && typeof s.state === 'object') s = s.state;
  if (!s || typeof s !== 'object' || !Array.isArray(s.tasks) || s.tasks.length > KNOBS.me.tasksMax) return null;
  const seen = new Set(), tasks = [];
  for (const t of s.tasks) {
    if (!t || typeof t !== 'object' || typeof t.id !== 'string' || !/^t[0-9a-z]{1,8}$/.test(t.id) || seen.has(t.id)) return null;
    if (wordBad(t.word) || textBad(t.text)) return null;
    seen.add(t.id);
    const o = { id: t.id, word: t.word.trim(), text: t.text.trim(), after: Array.isArray(t.after) ? t.after : [], done: t.done === true,
                at: typeof t.at === 'string' ? t.at : isoMs() };
    if (o.done && typeof t.doneAt === 'string') o.doneAt = t.doneAt;
    tasks.push(o);
  }
  tasks.forEach(t => { t.after = Array.from(new Set(t.after.filter(a => typeof a === 'string' && seen.has(a) && a !== t.id))); });
  const top = tasks.reduce((m, t) => Math.max(m, nOf(t.id)), 0);
  return { v: 1, tasks, one: typeof s.one === 'string' && seen.has(s.one) ? s.one : null,
           n: Math.max(top, Number.isSafeInteger(s.n) && s.n > 0 ? s.n : 0) };     // ids count up and are never reused
}

/* story order: the after-chains from their roots (children by id), then any loop, then the rest by id */
function storyOrder(st) {
  const all = st.tasks.slice().sort((a, b) => nOf(a.id) - nOf(b.id)), ids = new Set(all.map(t => t.id));
  const kids = new Map(all.map(t => [t.id, []]));
  all.forEach(t => t.after.forEach(a => { if (ids.has(a)) kids.get(a).push(t); }));
  const out = [], seen = new Set();
  const walk = t => { if (seen.has(t.id)) return; seen.add(t.id); out.push(t); kids.get(t.id).forEach(walk); };
  all.filter(t => !t.after.some(a => ids.has(a)) && kids.get(t.id).length).forEach(walk);
  all.filter(t => !seen.has(t.id) && t.after.length).forEach(walk);
  all.forEach(t => { if (!seen.has(t.id)) { seen.add(t.id); out.push(t); } });
  return out;
}
/* THE ONE THING: his (or Orv's) pick while it is open; else the first open task in story order */
function theOne(st) {
  const t = st.one && st.tasks.find(x => x.id === st.one);
  return t && !t.done ? t : storyOrder(st).find(x => !x.done) || null;
}
function reaches(st, from, to) {                                 // does `from` already come after `to`?
  const at = new Map(st.tasks.map(t => [t.id, t])), seen = new Set(), stack = [from];
  while (stack.length) {
    const id = stack.pop(); if (id === to) return true; if (seen.has(id)) continue; seen.add(id);
    const t = at.get(id); if (t) stack.push(...t.after);
  }
  return false;
}

/* ── Orv's Action: the six ops, checked one by one ('' = good, else the reason it is dropped) ── */
function checkOp(st, op) {
  if (!op || typeof op !== 'object' || Array.isArray(op)) return 'not an op';
  const task = id => (typeof id === 'string' && st.tasks.find(t => t.id === id)) || null;
  const unknown = id => 'unknown id ' + clip(String(id), 20);
  switch (op.op) {
    case 'add': {
      const bad = wordBad(op.word) || textBad(op.text); if (bad) return bad;
      if (op.after == null) return '';
      if (!Array.isArray(op.after)) return 'after is not a list';
      if (op.after.length > KNOBS.me.afterMax) return 'after names too many tasks';
      for (const a of op.after) if (!task(a)) return unknown(a);
      return '';
    }
    case 'done': { const t = task(op.id); return !t ? unknown(op.id) : t.done ? 'already done' : ''; }
    case 'undone': { const t = task(op.id); return !t ? unknown(op.id) : !t.done ? 'not done' : ''; }
    case 'link':
      if (!task(op.a)) return unknown(op.a);
      if (!task(op.b)) return unknown(op.b);
      if (op.a === op.b) return 'a task cannot follow itself';
      return reaches(st, op.a, op.b) ? 'that link would make a loop' : '';
    case 'one': { const t = task(op.id); return !t ? unknown(op.id) : t.done ? 'that task is done' : ''; }
    case 'edit': {
      if (!task(op.id)) return unknown(op.id);
      if (op.word === undefined && op.text === undefined) return 'nothing to edit';
      return (op.word !== undefined && wordBad(op.word)) || (op.text !== undefined && textBad(op.text)) || '';
    }
    default: return 'unknown op ' + clip(String(op.op), 20);
  }
}
function normOp(op) {                                            // only the known fields, trimmed
  const o = { op: op.op };
  if (op.op === 'add') { o.word = op.word.trim(); o.text = op.text.trim(); if (Array.isArray(op.after) && op.after.length) o.after = Array.from(new Set(op.after)); }
  else if (op.op === 'link') { o.a = op.a; o.b = op.b; }
  else { o.id = op.id; if (op.op === 'edit') { if (op.word !== undefined) o.word = op.word.trim(); if (op.text !== undefined) o.text = op.text.trim(); } }
  return o;
}
function applyOp(st, o, at) {                                    // o has passed checkOp; never deletes anything
  const t = o.id ? st.tasks.find(x => x.id === o.id) : null;
  if (o.op === 'add') { st.n += 1; st.tasks.push({ id: 't' + st.n.toString(36), word: o.word, text: o.text, after: (o.after || []).slice(), done: false, at }); }
  else if (o.op === 'done') { t.done = true; t.doneAt = at; }
  else if (o.op === 'undone') { t.done = false; delete t.doneAt; }
  else if (o.op === 'link') { const b = st.tasks.find(x => x.id === o.b); if (!b.after.includes(o.a)) b.after.push(o.a); }
  else if (o.op === 'one') st.one = o.id;
  else if (o.op === 'edit') { if (o.word !== undefined) t.word = o.word; if (o.text !== undefined) t.text = o.text; }
}
function runOps(st, ops) {                                       // valid ones applied in order; the rest dropped, with reasons
  const applied = [], dropped = [], at = isoMs();
  if (!Array.isArray(ops)) return { applied, dropped: [{ i: 0, reason: 'ops is not a list', op: ops }] };
  ops.forEach((op, i) => {
    if (i >= KNOBS.me.opsMax) return dropped.push({ i, reason: 'more than ' + KNOBS.me.opsMax + ' ops in one reply', op });
    const why = checkOp(st, op);
    if (why) return dropped.push({ i, reason: why, op });
    const o = normOp(op); applyOp(st, o, at); applied.push(o);
  });
  return { applied, dropped };
}
/* the reply: the whole of it as JSON, else the first balanced {…}; null when nothing parses */
function parseReply(raw) {
  const s = String(raw || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const obj = x => (x && typeof x === 'object' && !Array.isArray(x) ? x : null);
  try { return obj(JSON.parse(s)); } catch (e) { /* look for the first {…} */ }
  const i = s.indexOf('{'); if (i < 0) return null;
  let depth = 0, str = false, esc = false;
  for (let j = i; j < s.length; j++) {
    const c = s[j];
    if (str) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') str = false; continue; }
    if (c === '"') str = true;
    else if (c === '{') depth++;
    else if (c === '}' && --depth === 0) { try { return obj(JSON.parse(s.slice(i, j + 1))); } catch (e) { return null; } }
  }
  return null;
}
function sayOf(raw) {                                            // an unparsed reply may still carry a readable "say"
  const m = /"say"\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(String(raw || ''));
  try { return m ? clip(JSON.parse('"' + m[1] + '"').trim(), KNOBS.me.sayMax) : ''; } catch (e) { return ''; }
}
const rawOf = x => { let s; try { s = JSON.stringify(x); } catch (e) { s = String(x); } return clip(String(s), 300); };

/* Orv's system words: INK's hot context (the seed verbatim first, then his state lines), the ids, the rule */
function orvSystem(st) {
  const order = storyOrder(st), one = theOne(st);
  const open = order.filter(t => !t.done && t !== one), done = order.filter(t => t.done);
  const hot = INK.hotContext({ name: KNOBS.me.carrying, tasks: (one ? [one] : []).concat(open, done), words: '' });
  let ids = '';
  for (const t of (one ? [one] : []).concat(open, done.slice().reverse())) {
    const bit = t.id + ' ' + t.word + (t.done ? ' (done)' : t === one ? ' (the one thing)' : '');
    if (ids.length + bit.length + 3 > KNOBS.me.idsMax) break;
    ids += (ids ? ' · ' : '') + bit;
  }
  const next = [1, 2, 3, 4].map(k => 't' + (st.n + k).toString(36)).join(', ') + '…';
  return hot + '\nTask ids: ' + (ids || 'none yet') + '\n' + KNOBS.me.rule.replace('{next}', next);
}

/* the door, chosen by the key's stamp; the door lists its own models and a fast one is picked by name */
function fastest(ids) {
  const ok = ids.filter(id => !KNOBS.me.notChat.test(id));
  for (const h of KNOBS.me.fast) { const m = ok.find(id => id.toLowerCase().includes(h)); if (m) return m; }
  return ok[0] || ids[0];
}
function writeBox(change) {                                      // re-read, change one thing, write back: the Sword's shape kept
  const b = readBox(); change(b);
  try { localStorage.setItem(BOX, JSON.stringify(b)); return true; } catch (e) { ME.note = 'this phone would not keep the key'; return false; }
}
async function mePick(d, key) {
  const b = readBox(), named = String(((b.models || {})[d]) || '').trim(), L = (b.lists || {})[d];
  if (named) return named;
  if (L && L.pick) return String(L.pick);
  const ids = await listModels(d, key);
  if (!ids.length) throw new Error('that door listed no models');
  const pick = fastest(ids);
  writeBox(x => { x.lists = x.lists || {}; x.lists[d] = { ids, pick, at: isoMs() }; });
  return pick;
}
async function meCall(d, key, model, system, words) {
  const H = headers(d, key), max = KNOBS.me.tokens;
  const go = async (url, body) => {
    const r = await fetchT(url, { method: 'POST', headers: H, body: JSON.stringify(body) });
    let o = {}; try { o = await r.json(); } catch (e) { /* no body */ }
    return { r, o };
  };
  const fail = (r, o) => { const e = o && o.error; throw new Error(String((e && (e.message || e)) || r.statusText || 'status ' + r.status)); };
  if (d === 'anthropic') {
    const { r, o } = await go(DOORS[d].chat, { model, max_tokens: max, system, messages: [{ role: 'user', content: words }] });
    if (!r.ok) fail(r, o);
    return (o.content || []).map(c => c.text || '').join('');
  }
  if (d === 'gemini') {
    const { r, o } = await go(DOORS[d].chat + encodeURIComponent(model) + ':generateContent', {
      systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: words }] }],
      generationConfig: { maxOutputTokens: max, responseMimeType: 'application/json' } });
    if (!r.ok) fail(r, o);
    const c = ((o.candidates || [])[0] || {}).content;
    return ((c && c.parts) || []).map(x => x.text || '').join('');
  }
  const body = { model, max_tokens: max, messages: [{ role: 'system', content: system }, { role: 'user', content: words }],
                 response_format: { type: 'json_object' } };
  let { r, o } = await go(DOORS[d].chat, body);
  if (!r.ok && r.status === 400) { delete body.response_format; ({ r, o } = await go(DOORS[d].chat, body)); }   // no JSON mode: ask plainly, parse the first {…}
  if (!r.ok) fail(r, o);
  return (((o.choices || [])[0] || {}).message || {}).content || '';
}

function meSay(text, stage) { ME.say = { text, stage: !!stage }; }
function meStage(key) {
  if (key && !DOORS[doorOf(key)]) return '(Orv squints at the key. No door answers to that stamp.)';
  const one = theOne(ME.st);
  return one ? '(No key in the box. Orv taps the gold word, ' + one.word + ', and waits.)' : '(No key in the box. Orv points at the + and waits.)';
}

/* he speaks: his words go on the log FIRST, verbatim; only then is a door knocked on */
async function meSpeak() {
  if (ME.busy) return;
  const ta = $('meWords'), raw = ta.value;
  if (!raw.trim()) { ta.focus(); return; }
  if (!logIt({ who: 'k', what: 'say', text: raw })) { meSay('(The glass is full. Your words stay in the box.)', true); return meRender(); }
  ta.value = '';
  ME.note = '';
  const key = String(readBox().apiKey || '').trim(), d = doorOf(key);
  if (key && DOORS[d] && !KNOBS.freeDoors.includes(d) && raw.indexOf(KNOBS.password) >= 0) {
    const paid = meGet('paid', {}) || {};
    if (!paid[d]) { paid[d] = isoMs(); mePut('paid', paid); logIt({ who: 'k', what: 'cha-ching', text: d }); }
  }
  if (!key || !DOORS[d]) { meSay(meStage(key), true); return meRender(); }
  if (!KNOBS.freeDoors.includes(d) && !(meGet('paid', {}) || {})[d]) {
    meSay('(The ' + d + ' door costs coin. Orv holds out his gear hand and waits for the word ' + KNOBS.password + '.)', true);
    return meRender();
  }
  ME.busy = true; meRender();
  let model = '';
  try {
    model = await mePick(d, key);
    meTake(d, model, String(await meCall(d, key, model, orvSystem(ME.st), raw)));
  } catch (e) {
    const why = String((e && e.message) || e);
    logIt({ who: 'ai:' + d + ':' + (model || '?'), what: 'error', text: clip(why, 300) });
    meSay('(The ' + d + ' door did not answer: ' + clip(why, 160) + ')', true);
  } finally { ME.busy = false; meRender(); }
}
function meTake(d, model, reply) {
  const who = 'ai:' + d + ':' + model, o = parseReply(reply);
  if (!o) {
    const say = sayOf(reply);
    logIt({ who, what: 'unparsed', text: clip(reply, KNOBS.me.rawMax) });
    ME.note = 'nothing changed';
    return meSay(say || '(Orv mutters something the glass cannot read. Nothing changed.)', !say);
  }
  const say = typeof o.say === 'string' ? clip(o.say.trim(), KNOBS.me.sayMax) : '';
  const st = JSON.parse(JSON.stringify(ME.st));
  const { applied, dropped } = o.ops === undefined ? { applied: [], dropped: [] } : runOps(st, o.ops);
  if (applied.length && mePut('state', st)) ME.st = st;
  logIt({ who, what: 'reply', text: say, ops: applied });
  dropped.forEach(x => logIt({ who, what: 'dropped', text: 'op ' + (x.i + 1) + ': ' + x.reason, raw: rawOf(x.op) }));
  ME.note = applied.length || dropped.length ? applied.length + ' done' + (dropped.length ? ' · ' + dropped.length + ' dropped' : '') : '';
  meSay(say || '(Orv nods.)', !say);
}

/* his hand: the same checks, logged who:'k' */
function handOp(op, what) {
  const why = checkOp(ME.st, op);
  if (why) { if (ME.menu) { ME.menu.why = why; drawMenu(); } return false; }
  const st = JSON.parse(JSON.stringify(ME.st)), o = normOp(op);
  applyOp(st, o, isoMs());
  if (!mePut('state', st)) { if (ME.menu) { ME.menu.why = ME.note; drawMenu(); } return false; }
  ME.st = st;
  logIt({ who: 'k', what, ops: [o] });
  closeMenu(); meRender();
  return true;
}
function meTap(id, el) {
  if (ME.menu && ME.menu.mode === 'link' && ME.menu.id) {        // "link": the star tapped now is the one it comes after
    if (id !== ME.menu.id) handOp({ op: 'link', a: id, b: ME.menu.id }, 'link');
    return;
  }
  openMenu(id, el, 'main');
}
function openMenu(id, el, mode) { ME.menu = { id, mode, at: el.getBoundingClientRect(), why: '' }; drawMenu(); }
function closeMenu() { ME.menu = null; const m = $('menu'); if (m) { m.hidden = true; m.textContent = ''; } }
function drawMenu() {
  const m = ME.menu, box = $('menu');
  if (!m) return closeMenu();
  const t = m.id ? ME.st.tasks.find(x => x.id === m.id) : null;
  if (m.id && !t) return closeMenu();
  box.textContent = '';
  const form = m.mode === 'add' || m.mode === 'rename';
  box.classList.toggle('form', form);
  const word = (label, fn) => { const b = mk('button', 'word', label); b.type = 'button'; b.addEventListener('click', fn); box.appendChild(b); return b; };
  const mode = md => () => { m.mode = md; m.why = ''; drawMenu(); };
  if (form) {
    box.appendChild(mk('p', 'cue', m.mode === 'add' ? 'a new task' : 'rename'));
    const w = mk('input'), l = mk('textarea');
    w.type = 'text'; w.maxLength = KNOBS.me.wordMax; w.placeholder = 'one word'; w.value = t ? t.word : ''; w.setAttribute('aria-label', 'the word');
    w.autocomplete = 'off'; l.rows = 2; l.maxLength = KNOBS.me.lineMax; l.placeholder = 'the line'; l.value = t ? t.text : ''; l.setAttribute('aria-label', 'the line');
    box.append(w, l);
    const row = mk('div', 'row'); box.appendChild(row);
    const ok = mk('button', 'word', m.mode === 'add' ? 'add' : 'keep'), no = mk('button', 'word', 'never mind');
    ok.type = no.type = 'button';
    ok.addEventListener('click', () => handOp(m.mode === 'add' ? { op: 'add', word: w.value, text: l.value } : { op: 'edit', id: t.id, word: w.value, text: l.value },
                                              m.mode === 'add' ? 'add' : 'rename'));
    no.addEventListener('click', closeMenu);
    row.append(ok, no);
    setTimeout(() => w.focus(), 0);
  } else if (m.mode === 'link') {
    box.appendChild(mk('p', 'line', 'tap the star ' + t.word + ' comes after'));
    word('never mind', mode('main'));
  } else {
    box.appendChild(mk('p', 'cue', t.word));
    box.appendChild(mk('p', 'line', t.text));
    word('rename', mode('rename'));
    if (t.done) word('undone', () => handOp({ op: 'undone', id: t.id }, 'undone'));
    else word('done', () => handOp({ op: 'done', id: t.id }, 'done'));
    if (!t.done && theOne(ME.st) !== t) word('the one thing', () => handOp({ op: 'one', id: t.id }, 'one'));
    word('link', mode('link'));
    if (!t.done) word('strike', () => handOp({ op: 'done', id: t.id }, 'strike'));   // marks done; never deletes
  }
  if (m.why) box.appendChild(mk('p', 'dim', m.why));
  box.hidden = false;
  const pad = KNOBS.pad, W = innerWidth, H = innerHeight, bw = box.offsetWidth, bh = box.offsetHeight, r = m.at;
  let x = r.left + r.width / 2 - bw / 2, y = form ? pad + 44 : r.bottom + 6;    // a form sits high, above the keyboard
  if (!form && y + bh > H - pad) y = r.top - bh - 6;
  box.style.left = Math.max(pad, Math.min(x, W - bw - pad)) + 'px';
  box.style.top = Math.max(pad, Math.min(y, H - bh - pad)) + 'px';
}

/* ── drawing ── */
function meWords(ol, list, cls) {
  ol.textContent = '';
  list.forEach(t => {
    const li = mk('li'), b = mk('button', cls, t.word);
    b.type = 'button'; b.dataset.id = t.id; b.title = t.text;
    b.setAttribute('aria-label', t.word + ' — ' + t.text + (t.done ? ', done' : ''));
    b.addEventListener('click', () => meTap(t.id, b));
    li.appendChild(b); ol.appendChild(li);
  });
}
function fitGuard() {
  const g = $('guard'); if (g.hidden) return;
  g.style.whiteSpace = 'nowrap';
  for (const px of KNOBS.me.guardPx) { g.style.fontSize = px + 'px'; if (g.scrollWidth <= g.clientWidth) break; }
  if (g.scrollWidth > g.clientWidth) g.style.whiteSpace = 'normal';
}
const SVGNS = 'http://www.w3.org/2000/svg';
function drawMeSky(order, one) {
  const svg = $('meSky'), K = INK.KNOBS.sky, keep = Object.assign({}, K), look = KNOBS.me.look;
  Object.assign(K, KNOBS.me.sky);                                // the same renderer (§2), sized for half a phone
  try {
    const tasks = order.map(t => ({ id: t.id, word: t.word, text: t.text, after: t.after, done: t.done, who: 'k' }));
    if (!ME.sky) ME.sky = INK.drawSky(svg, tasks, [], {}); else ME.sky.draw(tasks, []);
    const gold = String(INK.KING_HEX).toLowerCase();
    svg.querySelectorAll('circle').forEach(c => {
      if ((c.getAttribute('stroke') || '').toLowerCase() === gold) c.remove();              // INK rings its own first open star
      else if ((c.getAttribute('fill') || '').toLowerCase() === gold) c.setAttribute('fill', look.ink);   // his ink: the gold is the crossguard's alone
    });
    const s = one && INK.layout(tasks).stars.find(x => x.id === one.id), g = s && svg.querySelector('[data-id="' + one.id + '"]');
    if (g) {
      const ring = document.createElementNS(SVGNS, 'circle');
      [['cx', s.x], ['cy', s.y], ['r', K.ring], ['fill', 'none'], ['stroke', look.ink], ['stroke-width', 1], ['vector-effect', 'non-scaling-stroke']]
        .forEach(([k, v]) => ring.setAttribute(k, String(v)));
      g.appendChild(ring);
    }
  } finally { Object.assign(K, keep); }
}
function meRender() {
  const st = ME.st, one = theOne(st), order = storyOrder(st), done = st.tasks.filter(t => t.done);
  $('meName').textContent = KNOBS.me.title;
  $('meCount').textContent = st.tasks.length ? done.length + ' of ' + st.tasks.length + ' done' : '';
  const at = t => t.doneAt || '';
  meWords($('blade'), done.slice().sort((a, b) => (at(a) < at(b) ? -1 : at(a) > at(b) ? 1 : nOf(a.id) - nOf(b.id))), 'struck');
  meWords($('handle'), order.filter(t => !t.done && t !== one), '');
  const g = $('guard');
  g.hidden = !one; g.textContent = one ? one.word : ''; g.dataset.id = one ? one.id : '';
  g.setAttribute('aria-label', one ? 'the one thing: ' + one.word + ' — ' + one.text : 'the one thing');
  $('guardLine').textContent = one ? one.text : st.tasks.length ? 'every task is done' : 'tell Orv what the day holds, or tap +';
  fitGuard();
  drawMeSky(order, one);
  const say = $('meSay'); say.textContent = ME.say ? ME.say.text : ''; say.classList.toggle('stage', !!(ME.say && ME.say.stage));
  const key = String(readBox().apiKey || '').trim(), usable = !!key && !!DOORS[doorOf(key)];
  $('meKey').hidden = usable;
  $('meKeyLine').textContent = key && !usable ? 'No door answers to that key — paste another' : KNOBS.me.keyLine;
  $('meSpeak').disabled = ME.busy; $('meSpeak').textContent = ME.busy ? 'orv is reading' : 'speak';
  $('meNote').textContent = ME.note || '';
}
function meNote(t) { ME.note = t; $('meNote').textContent = t; }

/* the shelf: joined projects; opening one switches the glass into project mode for it */
function meShelf() {
  const box = $('meShelfList'), all = projects();
  box.textContent = '';
  if (all.length) all.forEach(p => {
    const inv = getFor(p, 'invite', null), b = mk('button', 'word', inv && inv.name ? inv.name : p);
    b.type = 'button'; b.addEventListener('click', () => enter(p)); box.appendChild(b);
  });
  else box.appendChild(mk('p', 'dim', 'No projects yet. Paste an invite link to join one.'));
  box.appendChild(pasteBox());
}

/* keep: every ink.me.* key as one .json, through the share sheet (or a download) */
async function meKeep() {
  logIt({ who: 'k', what: 'keep' });
  const keys = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (!k || !k.startsWith('ink.me.')) continue;
      const v = localStorage.getItem(k); try { keys[k] = JSON.parse(v); } catch (e) { keys[k] = v; }
    }
  } catch (e) { return meNote('this phone would not read its kingdom'); }
  const name = 'kingdom-' + isoMs().slice(0, 10) + '.json';
  const file = new File([JSON.stringify({ v: 1, kind: 'ink.me', at: isoMs(), keys })], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return meNote('kept'); }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  meNote('kept as ' + name);
}
/* restore: the kingdom on this glass is first set aside under ink.me.stash.<at> — never deleted */
async function meRestore(file) {
  let o = null; try { o = JSON.parse(await file.text()); } catch (e) { o = null; }
  const keys = o && o.kind === 'ink.me' && o.keys && typeof o.keys === 'object' ? o.keys : null;
  const st = keys && cleanState(keys[meKey('state')]);
  if (!st) return meNote('that file is not a kingdom');
  const log = meGet('log', []);
  if (!isEmpty(ME.st) || (Array.isArray(log) && log.length)) {
    if (!mePut('stash.' + isoMs(), { state: ME.st, log })) return meNote('no room to set this kingdom aside; nothing changed');
  }
  Object.keys(keys).forEach(k => { if (k.startsWith('ink.me.') && k !== meKey('state')) mePut(k.slice(7), keys[k]); });
  mePut('state', st); ME.st = st;
  logIt({ who: 'k', what: 'restore', text: clip(file.name || 'a file', 80) });
  meNote('restored'); meRender();
}
/* #seed= plants a prepared kingdom, only into an empty one */
async function meSeed(raw) {
  let o = null;
  try { o = JSON.parse(INK.unutf8(await INK.inflate(INK.unb64url(raw)))); } catch (e) { o = null; }
  const st = cleanState(o);
  if (!st) { ME.note = 'that seed link is not whole'; return false; }
  if (!isEmpty(meGet('state', null))) { ME.note = 'a seed only plants an empty kingdom; yours is kept'; return false; }
  if (!mePut('state', st)) return false;
  logIt({ who: 'k', what: 'seed', text: st.tasks.length + ' tasks' });
  return true;
}

function showMode(personal) {
  ME.on = personal;
  $('tabs').hidden = personal; $('track').hidden = personal; $('me').hidden = !personal;
  const seat = personal ? $('meOrvSeat') : $('corner');
  if ($('orv').parentNode !== seat) seat.appendChild($('orv'));
  const L = personal ? KNOBS.me.look : KNOBS, root = document.documentElement.style;
  root.setProperty('--ground', L.ground); root.setProperty('--ink', L.ink); root.setProperty('--dim', L.dim); root.setProperty('--faint', L.faint);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', L.ground);
}
async function meEnter(seedRaw) {
  if (S.box) { S.box.stop(); S.box = null; }
  P = null; S.inv = null;
  showMode(true);
  if (seedRaw) await meSeed(seedRaw);
  const stored = meGet('state', null);
  ME.st = cleanState(stored);
  if (!ME.st) {
    if (stored != null) mePut('stash.' + isoMs(), { state: stored, why: 'unreadable' });   // set aside, never lost
    ME.st = emptyState();
  }
  const log = meGet('log', []);
  const last = (Array.isArray(log) ? log : []).slice().reverse().find(e => e && typeof e.who === 'string' && e.who.startsWith('ai:') && e.what === 'reply' && e.text);
  meSay(last ? last.text : KNOBS.me.hello, !last);
  meRender();
}

/* ═══ BOOT ═══ */
async function boot() {
  const root = document.documentElement.style;                          // KNOBS → CSS, so the numbers live in one place
  root.setProperty('--ground', KNOBS.ground); root.setProperty('--ink', KNOBS.ink); root.setProperty('--dim', KNOBS.dim);
  root.setProperty('--faint', KNOBS.faint); root.setProperty('--gold', INK.hex(INK.KING)); root.setProperty('--pad', KNOBS.pad + 'px');
  root.setProperty('--script', KNOBS.scriptPx + 'px');
  root.setProperty('--orv-w', 41 * KNOBS.orvScale + 'px'); root.setProperty('--orv-h', 50 * KNOBS.orvScale + 'px');
  root.setProperty('--blade', KNOBS.me.bladePx + 'px'); root.setProperty('--handle', KNOBS.me.handlePx + 'px');

  const track = $('track');
  track.scrollLeft = track.clientWidth;                                  // open on HOME, the middle pane
  track.addEventListener('scroll', renderTabs, { passive: true });
  addEventListener('resize', () => { const i = paneNow(); track.scrollLeft = i * track.clientWidth; });
  document.querySelectorAll('#tabs button[data-pane]').forEach(b => b.addEventListener('click', () => track.scrollTo({ left: +b.dataset.pane * track.clientWidth, behavior: 'smooth' })));
  $('toMe').addEventListener('click', () => meEnter(null));
  $('name').addEventListener('click', () => { const all = projects(); if (all.length > 1) enter(all[(all.indexOf(P) + 1) % all.length]); });
  $('joinBtn').addEventListener('click', join);
  $('askBtn').addEventListener('click', askOrv);
  $('orv').addEventListener('click', () => (ME.on ? meSpeak() : askOrv()));
  /* personal mode: his hand on the sword, the sky, the shelf */
  $('meSpeak').addEventListener('click', meSpeak);
  $('meWords').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); meSpeak(); } });
  $('guard').addEventListener('click', () => { if ($('guard').dataset.id) meTap($('guard').dataset.id, $('guard')); });
  $('plus').addEventListener('click', () => openMenu(null, $('plus'), 'add'));
  const sky = $('meSky'), skyTap = e => {                        // INK's own tap would select; here a tap opens the word menu
    const g = e.target.closest && e.target.closest('[data-id]');
    e.stopPropagation();
    if (g) { if (e.type === 'keydown') e.preventDefault(); meTap(g.getAttribute('data-id'), g); }
  };
  sky.addEventListener('click', skyTap, true);
  sky.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') skyTap(e); }, true);
  document.addEventListener('pointerdown', e => {               // a tap anywhere else lets the menu go
    if (!ME.menu || $('menu').contains(e.target) || (e.target.closest && e.target.closest('[data-id]'))) return;
    closeMenu();
  }, true);
  $('meKeySave').addEventListener('click', () => {
    const k = $('meKeyIn').value.trim(), d = doorOf(k);
    if (!k) return $('meKeyIn').focus();
    if (!DOORS[d]) return meNote('no door answers to that stamp');
    if (!writeBox(b => { b.apiKey = k; })) return meRender();
    $('meKeyIn').value = '';
    logIt({ who: 'k', what: 'key', text: d });                   // the door's name only; never the key
    meSay(KNOBS.freeDoors.includes(d) ? '(Orv hears the ' + d + ' door open.)'
                                      : '(The ' + d + ' door costs coin. Say ' + KNOBS.password + ' once and Orv will use it.)', true);
    meRender();
  });
  $('meProjects').addEventListener('click', () => {
    const l = $('meShelfList'), open = l.hidden;
    if (open) meShelf();
    l.hidden = !open; $('meProjects').setAttribute('aria-expanded', String(open));
  });
  $('meKeep').addEventListener('click', meKeep);
  $('meRestore').addEventListener('click', () => $('meFile').click());
  $('meFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) meRestore(f); });
  addEventListener('resize', () => { if (ME.on) { closeMenu(); fitGuard(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (ME.on) fitGuard(); });
  $('sendBtn').addEventListener('click', sendWords);
  $('pasteBtn').addEventListener('click', async () => { await readPasted($('pasteIn').value, $('pasteNote')); $('pasteIn').value = ''; });
  orvBoot();

  /* the hash: an invite (#ink=) or a message (#m=). Read once, then wiped from the address bar —
     an invite holds keys and should not sit in the history. */
  /* #seed= plants his kingdom (only into an empty one). No invite and no message: HIS KINGDOM (§12). */
  let got = null, seed = null;
  if (location.hash.length > 1) {
    const sm = /^#seed=([A-Za-z0-9_-]+)$/.exec(location.hash);
    if (sm) seed = sm[1]; else got = await INK.readLink(location.hash);
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (got && got.ink && !adopt(got.ink)) got = null;
  if (got && got.ink) enter(got.ink.p);
  else if (got && got.m && projects().length) { enter(projects()[0]); await takeBody(got.m); }
  else await meEnter(seed);
  if (!ME.on) track.scrollLeft = track.clientWidth;
  setInterval(resendDue, KNOBS.resendCheckMs);
  setInterval(renderRoad, KNOBS.roadMs);
}
boot();
