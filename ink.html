<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The wall. Scripts: this file, ink-core.js, palette333.js, and the optional orv-*.js modules (same origin). Never innerHTML with data: every
     word from a message, a snap or a door goes in through textContent. connect-src: the doors and the
     mailbox are https; http://127.0.0.1 is only for the fake mailbox in tests (§9). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0a">
<!-- No apple-mobile-web-app-capable: a standalone Home Screen app on iOS gets storage apart from Safari's,
     so it opened empty. The manifest says display "browser": the icon opens Safari, and ONE kingdom. -->
<meta name="apple-mobile-web-app-title" content="Orv">
<link rel="manifest" href="./ink.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon-192.png"><!-- the tab's own icon, so the browser never asks the host for a missing favicon.ico -->
<title>Inkling</title>
<link rel="stylesheet" href="./fonts.css">
<!--
  ink.html — THE PHONE GLASS of INKLING Phase 1. Orv lives here.
  The law is inkling/CONTRACT.md; where this file and the contract disagree, the contract wins.

  What it does, in order:
    1. Opens an invite (#ink=…) and keeps it under localStorage 'ink.<projectId>.*' — nothing else is
       ever written. The Sword's key box 'monomyth.focus.byok.v1' is READ for Orv's key, never written.
    2. Three panes on a native horizontal scroll-snap track (no JS swipe), opening on HOME:
         SCRIPT    the latest snap's script, each line in the ink of the hand that wrote it (§4)
         HOME      the constellation of tasks while writing, the sprite + scenes while filming (§2, §3);
                   below it Orv's corner: pick up to 3 stars, ask Orv, send an idea to the King (§7)
         MESSAGES  everything sent and received, newest last, each in its author's ink
    3. Roads (§5): the mailbox (only when the invite says mailbox:true) polls every 4 s; with it off,
       every send offers a sealed #m= link to hand over, and a paste box reads the King's links.
       A sent message waits in 'out' until a snap lists it as received; it is re-sent once an hour.

  The invite (made on the desk, POST /api/ink/invite; it holds keys, so it travels by hand only):
    {v:1, p, name, mid, member, color, key, room, topic, mailbox}
      p       project id                    mid     my member id (m1, m2…; the King's phone too)
      name    the inkling's name            member  my name, as the King wrote it
      color   my ink (THE 333 index)        key     my HMAC key (32 hex)
      room    room key (32 bytes b64url)    mailbox true = the King said yes to the mailbox (else off)
  Storage, all under 'ink.<p>.': invite · me {n,name,color,joined} · snap · log · out · talk · since · door · opened
  Test seam (§9): on a loopback page only, ?mailbox=http://127.0.0.1:<port> sets window.INK_MAILBOX.

  PERSONAL MODE (§12) is the default: no #ink= in the URL and no project open opens HIS KINGDOM.
    The Word Sword anchored to the left edge; the Constellation upper right; Orv's corner lower right.
    Between them two seams he drags, each carrying his name (HIGH KING LEEVZO · THE LUCKY); they hold
    where let go (ink.me.layout) and a double-tap puts them back. No panels, no buttons in tables:
    TAP a word = it opens AT THE WORD (its line, after/then, when) and everything below moves down;
    tap again = it folds. SWIPE right = done (undone on a done word), left = delete (archive if done).
    HOLD = the word becomes text in place (Enter or a tap away keeps it, Escape lets go). HOLD + DRAG =
    it follows the finger: onto the crossguard = the one thing, between two words = moved there in
    story order, onto a star = it comes after that star (a star dragged onto a star: the same). PULL the
    top down = projects · keep · restore. Orv is the Summon rig (OrvSummon2) and IS the send.
    Storage under 'ink.me.':
      state {v:1, tasks:[{id, word, text, after, done, at, doneAt?, deleted?, deletedAt?, archived?, archivedAt?}], one, n} ·
      log (append-only) · paid {door: at} (the doors opened by the word) · stash.<at> (a kingdom set aside
      by a restore) · kept (the day of the last "keep" file) · layout {v, h} (where he left the seams, px).
    His words are logged verbatim BEFORE any model call. State changes ONLY through applyOp() on an op
    that checkOp() passed, from his hand (who:'k') or from Orv (who:'ai:<door>:<model>'). Nothing is
    ever deleted: a delete or an archive (his hand only, by swipe) is a mark with its time, hidden from
    the sword, the sky and Orv, kept in state and the log. A move (his hand only, by drag) rewrites the
    after-links around the word. With no usable key, Orv asks for one and the key is written into
    the Sword's box ('monomyth.focus.byok.v1', the same {apiKey, models, lists} shape _glass.js keeps).
    #seed=<b64url(deflate(json))> plants a prepared kingdom only into an empty one, never over one.

  v4 (2026-10-01, CONTRACT §11): GROUPS · THE TALK · THE LOOK · THE DECIDE SLOT (JEV) · ORVAPP.
    GROUPS     state.groups [{id:'g'+base36, word, text}] (and gn, the group counter); a task's group is a
               group id or null. Orv's op {op:"group", word, text} makes one; add/edit take group. A wrong
               group id is dropped (logged) and the task goes on ungrouped. The groups show as words above
               the stars; a tap lights their stars, threads them, and puts their words in Orv's corner.
    THE TALK   ink.me.talk: his lines and Orv's, kept until he says "many thanks" (Orv rereads it each turn).
               "many thanks" lands the held ops, fires the ritual ('many-thanks'), and folds the talk away.
    SETTINGS   ink.me.settings {mode: advice|answer|action, meter: immersive|balanced|focus, typed, …modules'}.
               action applies Orv's ops at once; advice and answer hold them (ink.me.held) until "many thanks".
    THE LOOK   ink.me.look {words, ground, orv, sky, back}: indices into KNOBS.me.knobs (greys only, Orv at an
               integer scale); "darker", "orv bigger", "sword wider", "put it back" move it here at $0 unless a
               decide module (ORVAPP.decide) stands in. Every move is a log line {what:'look'}.
    JEV        a 'vck_' key or 'https://relay#pass' goes to its own box, 'monomyth.focus.decide.v1' — never
               Orv's box, never ink.me.*, never a log line. Cha-ching opens it like any paid door.
    ANTHROPIC  the browser header (anthropic-dangerous-direct-browser-access), thinking-sized max_tokens, a low
               effort (asked again plainly on a 400), text blocks only, a refusal said plainly.
    ORVAPP     window.ORVAPP is the one door for modules (orv-hex.js, orv-ritual.js, orv-settings.js,
               orv-onboard.js, orv-card.js, orv-decide.js — each optional, loaded if present):
                 state() · save(st, {who, what, text}) · apply(ops, {who}) · log(entry) · render()
                 say(text, {stage, typed, thread, log}) · speak(text) · ask(system, user, {json, tokens, from})
                 settings() · setSetting(k, v) · on(event, fn) → off · emit(event, payload)
                 slots {sky, corner, chat, top, overlay} · claim(slot) · release(slot)
                 tapGroup(id) · tapStar(id) · group() · look() · setLook(changes) · undoLook()
                 setKey(k) · decideBox() · door() · models() · useModel(name) · palette · modules · decide
               events: boot · speak (ev.stop() takes the words whole) · reply · render · tap-star · tap-group
                       many-thanks · look · setting · key · hold-orv (when heard, a still press on Orv is a hold)
-->
<style>
/* Every value here comes from KNOBS in the script below (set as CSS variables at boot);
   these fallbacks are the same numbers, so the page reads right before the script runs. */
:root {
  --ground: #0a0a0a; --ink: #e6e6e6; --dim: #8c8c8c; --faint: #333333; --gold: #FFA512;
  --pad: 16px; --script: 15px; --orv-w: 82px; --orv-h: 100px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); color: var(--ink); }
body {
  display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  font: 16px/1.35 'W95FA', ui-monospace, monospace; -webkit-font-smoothing: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0 8px;
         min-height: 44px; min-width: 44px; cursor: pointer; text-align: left; }
button:disabled { color: var(--dim); cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 1px dotted var(--ink); outline-offset: 2px; }
textarea, input { font: 16px/1.35 'W95FA', ui-monospace, monospace; color: var(--ink); background: transparent;
                  border: 0; border-bottom: 1px solid var(--faint); border-radius: 0; width: 100%; padding: 6px 0;
                  resize: none; -webkit-appearance: none; appearance: none; }
textarea::placeholder, input::placeholder { color: var(--dim); }
p, ol { margin: 0; }
ol { list-style: none; padding: 0; }
[hidden] { display: none !important; }

/* labels: Dogica 8px tracked caps, grey (the machine's voice) */
.cue { font-family: 'Dogica', ui-monospace, monospace; font-size: 8px; line-height: 12px; letter-spacing: .2em;
       text-transform: uppercase; color: var(--dim); margin: 10px 0 4px; overflow-wrap: anywhere; }
.dim { color: var(--dim); }
.word { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }

/* the top seat: the three pane words (tap = jump) and the road's state */
#tabs { flex: 0 0 auto; display: flex; align-items: center; gap: 2px;
        padding: env(safe-area-inset-top) var(--pad) 0; border-bottom: 1px solid var(--faint); min-width: 0; }
#tabs button { color: var(--dim); }
#tabs button[aria-current="true"] { color: var(--ink); }
#road { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        font-family: 'Dogica', ui-monospace, monospace; font-size: 8px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }

/* the track: native scroll-snap does the swipe; the browser follows the thumb, we add no handler */
#track { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
         scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
#track::-webkit-scrollbar { display: none; }
.pane { flex: 0 0 100%; width: 100%; min-width: 0; height: 100%; overflow-x: hidden; overflow-y: auto;
        scroll-snap-align: start; scroll-snap-stop: always;
        padding: 4px var(--pad) calc(16px + env(safe-area-inset-bottom)); }

/* SCRIPT: Courier Prime, each line in its hand's ink */
#script p { font: var(--script)/1.3 'Courier Prime', 'Courier New', Courier, monospace; white-space: pre-wrap;
            overflow-wrap: anywhere; min-height: 1.3em; -webkit-font-smoothing: auto; }
#script p.ai::after { content: ' ai'; font-family: 'Dogica', monospace; font-size: 8px; letter-spacing: .2em; color: var(--dim); }

/* HOME: the sky above, Orv's corner below */
#pHome { display: flex; flex-direction: column; overflow: hidden; }
#upper { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
#oneWord { font-family: 'Dogica', ui-monospace, monospace; font-size: 24px; line-height: 32px; color: var(--gold); overflow-wrap: anywhere; }
#oneText { margin: 4px 0 8px; }
#sky { display: block; width: 100%; height: auto; max-width: 440px; margin: 0 auto; color: var(--ink); font-family: 'W95FA', monospace; }
#sprite { display: block; margin: 8px auto; image-rendering: pixelated; image-rendering: crisp-edges; }
#scenes li { padding: 2px 0; overflow-wrap: anywhere; }
#scenes li.shot { color: var(--ink); }
#scenes li.next { color: var(--gold); }
#scenes li.later { color: var(--dim); }
#corner { flex: 0 0 auto; max-height: 58%; overflow-y: auto; overflow-x: hidden; border-top: 1px solid var(--faint);
          display: grid; grid-template-columns: minmax(0, 1fr) var(--orv-w); gap: 8px; align-items: end; padding-top: 4px; }
#left { min-width: 0; }
#orv { padding: 0; min-width: var(--orv-w); align-self: end; }
#orvCv { display: block; width: var(--orv-w); height: var(--orv-h); image-rendering: crisp-edges; image-rendering: pixelated; }
#chips { display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; }
#chips button { padding: 0 6px; }
#convo { max-height: 26vh; overflow-y: auto; }
#convo li { margin: 4px 0; overflow-wrap: anywhere; }
#convo li.stage { color: var(--dim); }                         /* a stage line is dim, never italic: a sheared pixel face is a guess */
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-width: 0; }
#inks { display: grid; grid-template-columns: repeat(4, 44px); gap: 4px; margin: 6px 0; }
#inks button { padding: 0; display: flex; align-items: center; justify-content: center; }
#inks i { display: block; width: 24px; height: 24px; border-radius: 50%; }
#inks button.taken i { width: 8px; height: 8px; }
#inks button[aria-checked="true"] i { outline: 1px solid var(--ink); outline-offset: 3px; }
#linkOut { font-size: 12px; color: var(--dim); }

/* MESSAGES: a script page, not a chat — a cue in the author's ink, the words beneath */
#log li { margin: 0 0 12px; }
#log .text { white-space: pre-wrap; overflow-wrap: anywhere; }
#log li.road .text { text-decoration: underline dotted var(--dim); text-underline-offset: 4px; }
#recordLines li { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; margin: 2px 0; }
summary { list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
summary::-webkit-details-marker { display: none; }

/* ═══ PERSONAL MODE (§12): the Word Sword anchored to the left edge, the Constellation upper right,
   Orv's corner lower right. Two seams the King drags: HIGH KING LEEVZO (vertical) and THE LUCKY
   (horizontal) — the letters ARE the border, no line is drawn. Words float free on a grey ground;
   no boxes, no borders, no panels. The only gold is the crossguard. ═══ */
#me { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
      padding: env(safe-area-inset-top) var(--pad) calc(6px + env(safe-area-inset-bottom)); }
/* the top of the glass: pull it down and the shelf words come out with the finger */
#meTop { flex: 0 0 auto; display: flex; align-items: center; min-width: 0; min-height: 40px;
         touch-action: none; -webkit-user-select: none; user-select: none; cursor: grab; }
#meTop .cue { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#meNudge { margin-left: auto; flex: 0 0 auto; }
.quiet { color: var(--dim); padding: 0 6px; }
#meShelf { flex: 0 0 auto; display: flex; align-items: center; overflow: hidden; min-width: 0; }
#meShelf .quiet:first-child { padding-left: 0; }
#meShelfList { flex: 0 0 auto; padding: 0 0 8px; }
#meShelfList > button { display: block; }
#meEmpty { flex: 0 0 auto; color: var(--dim); font-size: 13px; line-height: 1.35; margin: 2px 0 6px; }
#meEmpty button { min-height: 0; min-width: 0; padding: 0; color: var(--ink); }
#meMid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr);
         grid-template-columns: var(--vx, 46%) var(--seam) minmax(0, 1fr); }

/* the sword: flush left, one word a line, scrolled on its own */
#sword { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: clip; text-align: left; padding: 4px 0 24px; }
#sword button { display: block; width: 100%; text-align: left; padding: 0; overflow-wrap: anywhere; }
#sword [data-id] { touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#blade button { min-height: 30px; font-size: var(--blade); text-decoration: line-through; text-decoration-thickness: 1px; }
#guard { font-family: 'Dogica', ui-monospace, monospace; color: var(--gold); line-height: 1.3; padding: 8px 0 2px; overflow: hidden; }
#guardLine { font-size: 12px; line-height: 1.3; color: var(--dim); margin: 0 0 6px; overflow-wrap: anywhere; }
#handle button { min-height: 36px; font-size: var(--handle); }
#sword #plus { color: var(--dim); font-size: 22px; width: auto; }
/* a word opened AT the word: its information one step deeper and one size smaller, in the flow */
.unfold { margin: 0 0 8px var(--step); cursor: pointer; }
.unfold .full { font-size: var(--unfoldFull); line-height: 1.3; overflow-wrap: anywhere; margin: 0 0 3px; }
.unfold .line { font-size: var(--unfoldLine); line-height: 1.35; color: var(--dim); overflow-wrap: anywhere; }
/* the hold: the word lifts; the drag: it follows the finger, its place stays dim */
#sword .held, #meSky .held { opacity: .55; }
#sword .lifted, #meSky .lifted { opacity: .3; }
#ghost { position: fixed; z-index: 9; pointer-events: none; white-space: nowrap; color: var(--ink); margin: 0; }
#ghost.gold { color: var(--gold); }
#handle li { will-change: auto; }
/* an edit in place: the word itself becomes text, its line under it */
.editor { margin: 2px 0 8px; }
.editor input { font-size: inherit; padding: 2px 0; }
.editor .edWord { font-size: var(--handle); }
.editor .edWord.struck { font-size: var(--blade); }
.editor .edWord.gold { font-family: 'Dogica', ui-monospace, monospace; color: var(--gold); font-size: 16px; }
.editor textarea { font-size: var(--unfoldFull); margin-left: var(--step); width: calc(100% - var(--step)); }
.editor .line { font-size: var(--unfoldLine); color: var(--dim); margin-left: var(--step); }

/* the swipe: the word follows the thumb; the space it uncovers shows what letting go will do */
#swipe { position: fixed; z-index: 9; pointer-events: none; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
#swipe.past { color: var(--ink); }
#swipe svg { display: block; width: 21px; height: 21px; shape-rendering: crispEdges; }
#swipe .cue { margin: 0; color: inherit; }

/* the seams: his name is the border */
.seam { touch-action: none; -webkit-user-select: none; user-select: none; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
.seam:focus-visible { outline: 1px dotted var(--dim); outline-offset: -2px; }
.seam svg { display: block; flex: 0 0 auto; shape-rendering: crispEdges; }
#vseam { cursor: col-resize; flex-direction: column; gap: var(--nameGap); overflow: hidden; }
#hseam { cursor: row-resize; flex-direction: row; gap: var(--nameGap); overflow: hidden; }
.seam .sp { flex: 0 0 var(--nameSpace); width: var(--nameSpace); height: var(--nameSpace); }

#meRight { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr);
           grid-template-rows: var(--hy, 42%) var(--seam) minmax(0, 1fr); }
#meSkyCol { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-top: 4px; }
#meCount { text-align: center; margin: 4px 0 0; }
#meSky { display: block; width: 100%; height: auto; color: var(--ink); font-family: 'W95FA', monospace; }
#meSky .over text { font-weight: 700; }
#meCorner { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding-top: 2px; }
/* the talk: the thread so far (his lines in ink, Orv's earlier lines dim), then Orv's last words.
   "many thanks" folds it away; the log keeps every word. */
#meThread { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; margin: 0 0 4px; }
#meTalk { font-size: 13px; line-height: 1.35; }
#meTalk li { margin: 0 0 6px; overflow-wrap: anywhere; }
#meTalk li.orv { color: var(--dim); }
#meTalk li.stage { color: var(--dim); }
#meTalk:empty { display: none; }
#meSay { overflow-wrap: anywhere; margin: 0; }
#meSay.stage { color: var(--dim); }
/* the groups of the kingdom (the state of the kingdom): words, not boxes; a tapped one lights its stars */
#meGroups { display: flex; flex-wrap: wrap; gap: 0 10px; padding: 0 0 2px; }
#meGroups:empty { display: none; }
#meGroups button { min-height: 32px; min-width: 0; padding: 0; color: var(--dim); font-size: 13px;
                   text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }
#meGroups button[aria-pressed="true"] { color: var(--ink); font-weight: 700; text-decoration-color: var(--ink); }
#meSky .off text { fill: var(--dim); }
#meSky .lit text { font-weight: 700; }
/* the slots: where modules (orv-*.js) draw. Empty, they take no room. */
.slot:empty { display: none; }
#slotTop { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 0 6px; overflow: hidden; }
#slotChat, #slotCorner { min-width: 0; overflow-wrap: anywhere; }
#slotOverlay { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
#slotOverlay > * { pointer-events: auto; }
#meKey { flex: 0 0 auto; }
#meKey p { color: var(--dim); }
#meWords { flex: 0 0 auto; }
#meFoot { flex: 0 0 auto; display: flex; align-items: flex-end; gap: 6px; min-width: 0; }
#meNote { flex: 1 1 auto; min-width: 0; font-size: 13px; overflow-wrap: anywhere; padding-bottom: 4px; }
#meOrvSeat { flex: 0 0 auto; }
#orv:active { transform: translateY(2px); }                     /* Day One's press: he dips when tapped */
</style>
</head>
<body>
<nav id="tabs" aria-label="panes" hidden>
  <button type="button" id="toMe">kingdom</button>
  <button type="button" data-pane="0">script</button>
  <button type="button" data-pane="1">home</button>
  <button type="button" data-pane="2">messages</button>
  <span id="road"></span>
</nav>

<main id="track" hidden>
  <section class="pane" id="pScript" aria-label="script">
    <p class="cue" id="scriptHead"></p>
    <div id="script"></div>
  </section>

  <section class="pane" id="pHome" aria-label="home">
    <div id="upper">
      <p class="cue"><button type="button" id="name" class="cue" style="margin:0;padding:0"></button></p>
      <p class="cue" id="oneLab">the one thing</p>
      <p id="oneWord"></p>
      <p id="oneText"></p>
      <svg id="sky" role="group" aria-label="the constellation of tasks"></svg>
      <p class="cue" id="count"></p>
      <div id="film" hidden>
        <canvas id="sprite" width="64" height="64"></canvas>
        <ol id="scenes"></ol>
      </div>
      <p id="wait" class="dim" hidden></p>
      <div id="emptyPaste" hidden></div>
    </div>
    <div id="corner">
      <div id="left">
        <div id="join" hidden>
          <p class="cue">who is holding this glass?</p>
          <input id="who" type="text" autocomplete="name" maxlength="60" aria-label="your name">
          <p class="cue">pick an ink</p>
          <div id="inks" role="radiogroup" aria-label="your ink"></div>
          <button type="button" id="joinBtn" class="word">join</button>
        </div>
        <div id="talk" hidden>
          <ol id="convo" aria-live="polite"></ol>
          <div id="chips"></div>
          <textarea id="words" rows="2" placeholder="say it" aria-label="your words"></textarea>
          <div class="row">
            <button type="button" id="askBtn" class="word">ask orv</button>
            <button type="button" id="sendBtn" class="word">send to the king</button>
            <span id="sendNote" class="dim"></span>
          </div>
        </div>
        <div id="handoff" hidden>
          <p class="cue">the mailbox is off — hand these to the king</p>
          <ol id="handList"></ol>

<script>
'use strict';
/* ═══ KNOBS — every tunable value in one place (CONTRACT §8) ═══ */
const KNOBS = {
  ground: '#0a0a0a', ink: '#e6e6e6', dim: '#8c8c8c', faint: '#333333',   // greys only, R=G=B; dark so all 12 inks read
  pad: 16,                              // side gutter, px
  scriptPx: 15,                         // Courier Prime size on the phone
  orvSprite: 'orv/orv2.json',           // the one Orv (41×50, four idle poses); never redrawn here
  orvScale: 2,                          // integer scale only
  orvBeat: [1400, 520, 130, 190],       // ms each idle pose holds: his own clock (OrvSummon2.tsx BEAT — the breath held, then the summon)
  summon: {                             // THE SUMMON RIG, ported from components/world/Summon.tsx (his 09-13 ruling)
    mx: 5, my: 4,                       // art pixels of room for the lean (each side) and the lift (above), as the original left
    fps: 12,                            // twelve frames a second, on purpose: smooth motion on a pixel sprite reads as a smooth sprite
    energy: [0.34, 0.42],               // idle · listening (OrvSummon2's two moods)
    hold: 2                             // the pose he holds while he listens or reads: the raised claw, its sparks
  },
  spriteMaxScale: 8,                    // the inkling's sprite: the biggest integer scale that fits, up to this
  freeDoors: ['groq', 'gemini'],        // doors with a free tier; every other door waits for the word
  password: 'Cha-ching',                // the literal word that opens a paid door, once per ask (§8)
  orvTokens: 300,                       // Orv is succinct
  orvTimeoutMs: 45000,
  resendMs: 60 * 60 * 1000,             // an unacknowledged message is re-sent once an hour (§5)
  resendCheckMs: 30 * 1000,             // how often we look for one that is due (an unsent one is due at once)
  roadMs: 2000,                         // how often the road's state word is refreshed
  logMax: 1000,                         // this phone's list only; the record itself lives on the Throne
  talkMax: 60,                          // Orv's lines kept on this phone
  nameMax: 60,
  chipMax: 14,                          // characters of a word on a chip or in a cue
  me: {                                 // PERSONAL MODE (§12)
    look: { ground: '#454545', ink: '#EDEDED', dim: '#A6A6A6', faint: '#5C5C5C' },   // a grey ground, greys only (R=G=B)
    title: 'the kingdom',
    carrying: 'the King’s own kingdom',  // the hot context's "You are carrying …" line
    hello: '(Orv sits in the corner, one eye on you.)',
    keyLine: 'Orv needs a key — paste it here',
    sky: { cols: 3, dx: 58, dy: 66, pad: 30, arc: [0, 8, 0], r: 6, ring: 11, mark: 9, hit: 22, labelDy: 20, labelMax: 9, font: 13 },   // pad: room for a 9-letter word at the edge
    guardPx: [32, 24, 16, 8],           // the crossguard: the largest of these that fits whole on one line (Dogica is pixels: multiples of 8)
    bladePx: 14, handlePx: 16,          // blade and handle words; both below the crossguard's smallest
    swipeLock: 10,                      // px of movement before a drag is a swipe (mostly sideways) or a scroll (mostly up/down)
    swipeAt: 72,                        // px past which letting go acts; short of it the word goes home in one step
    holdMs: 320,                        // the Sword's hold (_engine.js THE REWRITE): still this long and the word lifts
    holdSlop: 8,                        // px a held word may wander before it is a drag (the Sword's own 8)
    unfold: { step: 14, full: 13, line: 12 },   // a word opened at the word: one step deeper (the Sword's .block 14px), one size smaller
    seams: {                            // the two borders he drags (Day One's barrier, turned on its side for the first)
      w: 22,                            // px: the thickness of a seam (the letters live in it)
      v: 0.48, h: 0.42,                 // defaults: the sword's share of the width · the sky's share of the right side
      vMin: 96, rightMin: 150,          // px the sword and the right side keep at the least
      hMin: 64, cornerMin: 190,         // px the sky and Orv's corner keep at the least
      moved: 3,                         // px of travel before a press on a seam is a drag, not a tap
      dbl: 320,                         // ms between two taps that put a seam back where it began
      nudge: 8                          // px an arrow key moves a focused seam
    },
    name: {                             // his name, in the Sword's own pixel face (5×7, bold), coloured letter by letter
      v: 'HIGH KING LEEVZO', h: 'THE LUCKY',
      scale: 2, gap: 4, space: 10,      // px: integer scale of a letter, the gap between letters, a word space
      step: 5,                          // the next letter's hue is this many places round the wheel (coprime with 14: every hue comes)
      floor: 3.0                        // contrast on the grey ground; a hue short of it is lifted in lightness, never darkened
    },
    wheel: ['#FF7A12', '#FF3D12', '#FF1239', '#FF12A1', '#FA12FF', '#9212FF', '#2A12FF',   // THE 23's WHEEL (_palette.part.js),
            '#126EFF', '#12D6FF', '#12FFC2', '#12FF5A', '#22FF12', '#8AFF12', '#F2FF12'],   // never the STAR's darks (the browns)
    glyphs: {                           // 7×7 pixel glyphs (the pixel faces carry no ✓ ✕ ↺): '#' = ink
      done:    ['......#', '.....##', '#...##.', '##.##..', '.###...', '..#....', '.......'],
      delete:  ['#.....#', '.#...#.', '..#.#..', '...#...', '..#.#..', '.#...#.', '#.....#'],
      undone:  ['.#.....', '#####..', '.#...#.', '......#', '......#', '.....#.', '.####..'],
      archive: ['#######', '#.....#', '#######', '.#...#.', '.#.#.#.', '.#...#.', '.#####.']
    },
    wordMax: 16, lineMax: 140, sayMax: 600, opsMax: 12, afterMax: 8, tasksMax: 2000,
    groupsMax: 64,                      // the groups of the kingdom (Outlandish, Grants…): a state of the kingdom, not a list of chores
    rawMax: 2000,                       // characters of an unparsed reply kept in the log
    idsMax: 1200,                       // characters of the id list in Orv's system words
    groupsChars: 700,                   // characters of the groups line in Orv's system words
    talkMax: 40, talkChars: 1400,       // the talk kept on the glass until "many thanks" · how much of it Orv rereads each turn
    askMax: 2000,                       // characters of a module's ask (and its answer) kept in the log, verbatim up to here
    tokens: 700,                        // a say plus twelve ops needs more room than a chat line
    fast: ['instant', 'flash-lite', 'flash', 'haiku', 'mini', 'fast', 'lite', 'small', '8b'],   // name hints, in order, for a fast default
    notChat: /whisper|tts|embed|guard|image|vision|audio|realtime|transcri|search|compound|moderation|dall-e|sora|codex|playai/i,
    anthropic: {                        // the Anthropic door: current models think before they answer, and the thinking counts
      tokens: 4096,                     //   against max_tokens, so 700 can come back empty. Thinking stays ON (it cannot be
      effort: 'low',                    //   switched off on the newest models); a low effort keeps Orv quick and cheap. A door that
      timeoutMs: 90000                  //   refuses the effort field (an older model) is asked again plainly, once.
    },
    thanks: /\bmany\s+thanks\b/i,       // his words that close the talk: the ritual, the held ops applied, the thread folded
    bow: '(Orv bows. The talk folds into the kingdom.)',
    modes: ['advice', 'answer', 'action'],          // how Orv helps (the night order): action applies his ops now; advice and
    meters: ['immersive', 'balanced', 'focus'],     //   answer hold them until "many thanks". The story meter: full world ↔ plain focus.
    settings: { mode: 'action', meter: 'balanced', typed: false },   // defaults; ink.me.settings overrides, modules add their own keys
    typedCps: 36,                       // Orv's words typed out, characters a second, stepped at the rig's 12 fps (the machine moves in steps)
    knobs: {                            // THE LOOK (the Jev slot: "speak and the design changes in front of your eyes"). Each knob
      words:  { steps: [-2, -1, 0, 1, 2], dflt: 2 },                 // is an index into fixed steps, clamped at both ends, so a
      blade:  [10, 12, 14, 16, 18], handle: [12, 14, 16, 20, 24],    // chooser can only pick from the menu the code holds out.
      guard:  [[16, 8], [24, 16, 8], [32, 24, 16, 8], [40, 32, 24, 16, 8], [48, 40, 32, 24, 16, 8]],   // Dogica in multiples of 8
      ground: { steps: ['#303030', '#3B3B3B', '#454545', '#4F4F4F', '#585858'], dflt: 2 },              // greys only: R=G=B, so no brown can exist here
      orv:    { steps: [1, 2, 3, 4], dflt: 1 },                      // the one Orv at an integer scale; never redrawn
      sky:    { steps: [0.8, 0.9, 1, 1.12, 1.25], dflt: 2 },         // the constellation's spacing
      width:  0.08,                     // a "wider"/"narrower" moves the sword's seam this share of the glass (his hand's seam, logged)
      back:   20                        // the looks kept for "put it back"
    },
    sayRules: 12,                       // a look phrase is short (at most this many words) and made only of the look's own words
    rule: 'Answer ONLY with one JSON object and nothing else: {"say":"…","ops":[…]}. ' +
      '"say": at most 600 characters, in your voice, plain words. ' +
      '"ops": what his words change, in order, at most 12, chosen ONLY from: ' +
      '{"op":"add","word":"OneWord","text":"the task, at most 140 characters","after":["<id>"],"group":"<group id>"} (after and group are optional) · ' +
      '{"op":"done","id":"<id>"} · {"op":"undone","id":"<id>"} · {"op":"link","a":"<id>","b":"<id>"} (b comes after a) · ' +
      '{"op":"one","id":"<id>"} (sets THE ONE THING) · {"op":"edit","id":"<id>","word":"…","text":"…","group":"<group id>"} · ' +
      '{"op":"group","word":"OneWord","text":"what this part of the kingdom is"} (a new group: a studio, a book, a door; groups hold tasks). ' +
      'A word is ONE word of at most 16 characters. Use only the ids above; tasks you add take the next ids in order: {next}; ' +
      'groups you add take the next group ids in order: {gnext}. ' +
      'Nothing is ever deleted. If his words name no deed, "ops" is [].'
  },
  modules: ['orv-hex.js', 'orv-ritual.js', 'orv-settings.js', 'orv-onboard.js', 'orv-card.js', 'orv-decide.js'],   // each optional
  modulesWaitMs: 1500                   // the glass waits at most this long for the modules before it opens
};
const BOX = 'monomyth.focus.byok.v1';   // the Sword's key box: read for Orv's key; personal mode writes a pasted key into it (same shape as _glass.js)
/* the doors, found by the key's stamp (the same stamps as _glass.js). URLs only: the door names its
   own models (§7), so there is no model id anywhere in this file. */
const DOORS = {
  groq:       { list: 'https://api.groq.com/openai/v1/models',       chat: 'https://api.groq.com/openai/v1/chat/completions' },
  openrouter: { list: 'https://openrouter.ai/api/v1/models',         chat: 'https://openrouter.ai/api/v1/chat/completions' },
  xai:        { list: 'https://api.x.ai/v1/models',                  chat: 'https://api.x.ai/v1/chat/completions' },
  openai:     { list: 'https://api.openai.com/v1/models',            chat: 'https://api.openai.com/v1/chat/completions' },
  anthropic:  { list: 'https://api.anthropic.com/v1/models?limit=100', chat: 'https://api.anthropic.com/v1/messages' },
  gemini:     { list: 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', chat: 'https://generativelanguage.googleapis.com/v1beta/models/' }
};

/* tests only (§9): a loopback page may point the road at a fake mailbox. On github.io this never fires. */
(function seam() {
  if (!/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) return;
  const m = new URLSearchParams(location.search).get('mailbox');
  if (m && /^http:\/\/127\.0\.0\.1:\d{2,5}$/.test(m)) window.INK_MAILBOX = m;
})();

const $ = id => document.getElementById(id);
const show = (id, on) => $(id).toggleAttribute('hidden', !on);   // an attribute, so it works on <svg> too
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
const clip = (s, n) => { const a = Array.from(String(s)); return a.length <= n ? String(s) : a.slice(0, n - 1).join('') + '…'; };
const iso = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
/* a write the phone refused, said in plain words (never the browser's own message): his room is full, or shut */
const full = e => (e && (e.name === 'QuotaExceededError' || e.code === 22 || /quota/i.test(String(e.message)))
  ? 'this phone’s room for the kingdom is full: tap keep to save it, then make room' : 'this phone would not keep that just now');
function when(at) {
  const d = new Date(at), p = n => String(n).padStart(2, '0');
  return isNaN(d) ? '' : p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ═══ STORAGE — every key this page writes is 'ink.<project id>.<name>' ═══ */
let P = null;                                                   // the open project's id
const okId = s => typeof s === 'string' && /^[a-z0-9][a-z0-9-]{0,63}$/.test(s);
function getFor(p, name, dflt) {
  try { const v = localStorage.getItem('ink.' + p + '.' + name); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; }
}
const get = (name, dflt) => getFor(P, name, dflt);
function put(name, v) {
  if (!okId(P)) return;
  try { localStorage.setItem('ink.' + P + '.' + name, JSON.stringify(v)); } catch (e) { S.note = full(e); }
}
function projects() {                                           // every inkling this glass holds, most recently opened first
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) { const m = /^ink\.([a-z0-9][a-z0-9-]*)\.invite$/.exec(localStorage.key(i) || ''); if (m) out.push(m[1]); } } catch (e) { /* storage shut */ }
  return out.sort((a, b) => getFor(b, 'opened', 0) - getFor(a, 'opened', 0));
}
function readBox() { try { return JSON.parse(localStorage.getItem(BOX) || '{}') || {}; } catch (e) { return {}; } }

/* ═══ STATE — everything shown derives from these, and these from recorded facts ═══ */
const S = { inv: null, me: null, snap: null, log: [], out: [], talk: [], sel: [], box: null, sky: null, pick: null, note: '', scriptN: -1, linkFor: '' };
const snapBody = () => (S.snap ? S.snap.snap : null);
const mailboxOn = () => !!(S.inv && S.inv.mailbox === true);
function member(id) { const s = snapBody(); return (s && (s.members || []).find(m => m.id === id)) || null; }
function inkOf(id) {
  if (id === 'k') return INK.hex(INK.KING);
  const m = member(id);
  if (id === S.inv.mid) return INK.hex(m && !S.out.some(o => o.kind === 'color') ? m.color : S.me.color) || KNOBS.ink;
  return (m && INK.hex(m.color)) || KNOBS.dim;
}
function nameOf(id) {
  if (id === S.inv.mid) return S.me.name || S.inv.member || id;
  const m = member(id);
  return m ? m.name : id === 'k' ? 'the King' : id;
}

/* an invite is checked field by field before it is kept; anything off and it is refused whole */
function inviteOk(v) {
  if (!v || typeof v !== 'object' || v.v !== 1 || !okId(v.p) || v.p === 'me') return false;   // 'ink.me.*' is his kingdom, never a project
  if (typeof v.mid !== 'string' || !/^m[1-9][0-9]*$/.test(v.mid)) return false;
  if (typeof v.key !== 'string' || !/^[0-9a-f]{32}$/.test(v.key)) return false;
  try { if (INK.unb64url(v.room).length !== 32) return false; } catch (e) { return false; }
  return true;
}
function adopt(v) {
  if (!inviteOk(v)) return false;
  const old = getFor(v.p, 'invite', null);
  P = v.p;
  const inv = { v: 1, p: v.p, name: String(v.name || v.p), mid: v.mid, member: clip(String(v.member || ''), KNOBS.nameMax),
                color: INK.INKS.includes(v.color) ? v.color : INK.INKS[0], key: v.key, room: v.room, mailbox: v.mailbox === true };
  put('invite', inv);
  if (!old || old.mid !== inv.mid || !get('me', null)) {        // a new hand on this glass starts its own count
    put('me', { n: 0, name: inv.member, color: inv.color, joined: false });
    put('out', []);
  }
  return true;
}

/* ═══ OPEN A PROJECT ═══ */
function enter(p) {
  meLetGo(); showMode(false);
  $('track').scrollLeft = $('track').clientWidth;                 // a project opens on HOME, the middle pane
  if (S.box) S.box.stop();
  P = p;
  S.inv = get('invite', null); S.me = get('me', { n: 0, name: '', color: INK.INKS[0], joined: false });
  S.snap = get('snap', null); S.log = get('log', []); S.out = get('out', []); S.talk = get('talk', []);
  S.sel = []; S.box = null; S.pick = null; S.scriptN = -1; S.linkFor = '';
  if (S.sky) { S.sky.selected = []; }
  put('opened', Date.now());
  render();
  startRoad();
}

/* ═══ THE ROADS (§5) ═══ */
async function startRoad() {
  if (!mailboxOn()) return;
  const top = await INK.topic(S.inv.room, P);                   // always computed, never taken on trust
  S.box = INK.mailbox(top);
  S.box.since = get('since', S.box.since);
  S.box.start(async body => { await takeBody(body); put('since', S.box.since); });
}
async function push(o) {                                        // one sealed body onto the mailbox
  if (!S.box || o.busy) return false;
  o.busy = true;
  try { await S.box.publish(o.body, o.id); o.sentAt = Date.now(); S.note = ''; return true; }
  catch (e) { S.note = 'the mailbox did not take it (' + (e.message || e) + ')'; return false; }
  finally { o.busy = false; put('out', S.out.map(x => ({ id: x.id, kind: x.kind, body: x.body, sentAt: x.sentAt }))); renderRoad(); }
}
function resendDue() {
  if (!S.box) return;
  const now = Date.now();
  S.out.filter(o => now - (o.sentAt || 0) >= KNOBS.resendMs).forEach(push);
}

/* a sealed body from the mailbox or a pasted link: opened under the room key, or dropped */
async function takeBody(body) {
  let msg = await INK.open(S.inv.room, body);
  if (!msg) {                                                   // perhaps it belongs to another inkling on this glass
    for (const p of projects()) {
      if (p === P) continue;
      const inv = getFor(p, 'invite', null);
      if (inv && (msg = await INK.open(inv.room, body))) { if (msg.p === p) { enter(p); break; } msg = null; }
    }
  }
  if (msg) await handle(msg);
  return !!msg;
}
const looksRight = m => !!m && typeof m === 'object' && m.v === 1 && m.p === P && typeof m.from === 'string' &&
  /^(k|m[1-9][0-9]*)$/.test(m.from) && Number.isSafeInteger(m.n) && m.n > 0 && typeof m.k === 'string' &&
  typeof m.text === 'string' && Array.isArray(m.tasks) && typeof m.at === 'string';

async function handle(msg) {
  if (!looksRight(msg)) return;
  if (msg.from === 'k') {
    if (!(await INK.verifyMessage(msg))) return;               // Phase 1: the King is trusted on the room key (§5)
    if (msg.k === 'snap') return takeSnap(msg);
    return addLog(entryOf(msg, false));
  }
  if (msg.from === S.inv.mid) {                                 // my own message, back from the road
    if (await INK.verifyMessage(msg, S.inv.key)) bumpN(msg.n);
    return;
  }
  addLog(entryOf(msg, false));                                  // another hand: unconfirmed until a snap lists it
}
function bumpN(n) { if (n > S.me.n) { S.me.n = n; put('me', S.me); } }

function takeSnap(msg) {
  const s = msg.snap;
  if (!s || typeof s !== 'object' || !s.project || s.project.id !== P || !Array.isArray(s.tasks) || !Array.isArray(s.members)) return;
  if (S.snap && S.snap.n >= msg.n) return;                       // an older snap changes nothing
  S.snap = { n: msg.n, at: msg.at, snap: s };
  put('snap', S.snap);
  const got = new Set(Array.isArray(s.received) ? s.received.map(String) : []);

/* ═══ ORV (§7) ═══ */
function doorOf(k) {
  k = String(k || '').trim();
  if (k.startsWith('gsk_')) return 'groq'; if (k.startsWith('sk-ant-')) return 'anthropic'; if (k.startsWith('sk-or-')) return 'openrouter';
  if (k.startsWith('xai-')) return 'xai'; if (k.startsWith('AIza') || k.startsWith('AQ.')) return 'gemini'; if (k.startsWith('sk-')) return 'openai';
  return 'unknown';
}
function fetchT(url, init, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || KNOBS.orvTimeoutMs);
  return fetch(url, Object.assign({}, init, { signal: c.signal, referrerPolicy: 'no-referrer' })).finally(() => clearTimeout(t));
}
/* The Anthropic door answers a browser only when the request says so: anthropic-dangerous-direct-browser-access.
   His own key, from his own phone, to Anthropic and nowhere else (the key never leaves this glass otherwise). */
function headers(d, key) {
  if (d === 'anthropic') return { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
  if (d === 'gemini') return { 'content-type': 'application/json', 'x-goog-api-key': key };
  return { 'content-type': 'application/json', authorization: 'Bearer ' + key };
}
async function listModels(d, key) {
  const o = await (await fetchT(DOORS[d].list, { headers: headers(d, key) })).json();
  if (d === 'gemini') return (o.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => String(m.name || '').replace(/^models\//, '')).filter(id => id && !/embedding|imagen|veo|tts|audio|image|live|native/i.test(id));
  return (o.data || []).map(m => String(m.id)).filter(id => !/whisper|tts|embed|guard|image/i.test(id));
}
async function pickModel(d, key) {                              // the box's own pick first, then the door's first
  const b = readBox();
  const named = String(((b.models || {})[d]) || '').trim() || String((((b.lists || {})[d]) || {}).pick || '');
  if (named) return named;
  const kept = get('door', {});
  if (kept[d]) return kept[d];
  const ids = await listModels(d, key);
  if (!ids.length) throw new Error('that door listed no models');
  kept[d] = ids[0]; put('door', kept);
  return ids[0];
}
/* one Anthropic call, the same for both glasses: thinking stays on (the newest models cannot switch it off), so
   max_tokens is roomy and the effort low; a 400 with the effort field is asked again without it, once; a refusal
   is said plainly; only text blocks are read (thinking blocks carry no words for him) */
async function anthropicCall(key, model, system, words) {
  const A = KNOBS.me.anthropic, body = { model, max_tokens: A.tokens, messages: [{ role: 'user', content: words }], output_config: { effort: A.effort } };
  if (system) body.system = system;
  const go = async () => {
    const r = await fetchT(DOORS.anthropic.chat, { method: 'POST', headers: headers('anthropic', key), body: JSON.stringify(body) }, A.timeoutMs);
    let o = {}; try { o = await r.json(); } catch (e) { /* no body */ }
    return { r, o };
  };
  let { r, o } = await go();
  if (!r.ok && r.status === 400 && body.output_config) { delete body.output_config; ({ r, o } = await go()); }
  if (!r.ok) { const e = o && o.error; throw new Error(String((e && (e.message || e)) || r.statusText || 'status ' + r.status)); }
  if (o.stop_reason === 'refusal') throw new Error('the door declined to answer' + (o.stop_details && o.stop_details.category ? ' (' + o.stop_details.category + ')' : ''));
  return (o.content || []).filter(c => c && c.type === 'text').map(c => c.text || '').join('');
}
async function talk(d, key, model, prompt) {
  const H = headers(d, key);
  if (d === 'anthropic') return anthropicCall(key, model, '', prompt);
  if (d === 'gemini') {
    const r = await fetchT(DOORS[d].chat + encodeURIComponent(model) + ':generateContent', { method: 'POST', headers: H,
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: KNOBS.orvTokens } }) });
    const o = await r.json(); if (!r.ok) throw new Error((o.error && o.error.message) || r.statusText);
    const c = ((o.candidates || [])[0] || {}).content;
    return ((c && c.parts) || []).map(x => x.text || '').join('');
  }
  const r = await fetchT(DOORS[d].chat, { method: 'POST', headers: H, body: JSON.stringify({ model, max_tokens: KNOBS.orvTokens, messages: [{ role: 'user', content: prompt }] }) });
  const o = await r.json(); if (!r.ok) throw new Error((o.error && o.error.message) || r.statusText);
  return (((o.choices || [])[0] || {}).message || {}).content || '';
}

  if (s && s.project.phase === 'filming') {

    if (next) return '(No key in the box. Orv points at the next scene: ' + next.heading + '.)';

let asking = false;
async function askOrv() {
  if (asking || !S.inv) return;
  const words = $('words').value.trim(), s = snapBody();
  if (words) pushTalk({ who: 'me', text: words });
  const key = String(readBox().apiKey || '').trim();

    return pushTalk({ who: 'orv', stage: true, text: '(The ' + d + ' door costs coin. Orv holds out his gear hand and waits for the word ' + KNOBS.password + '.)' });
  const hot = INK.hotContext({ name: s ? s.project.name : S.inv.name, seed: s ? s.project.seed : '', tasks: s ? s.tasks : [],
                              scenes: s ? s.scenes : [], selected: S.sel, words });
  asking = true; $('askBtn').disabled = true; $('askBtn').textContent = 'orv is reading';
  try {

/* ═══ ORV, SUMMONED — the King's own idle rig, ported whole from Monomyth components/world/Summon.tsx
   as focus/orv/OrvSummon2.tsx drives it (his ruling 2026-09-13: "give him the ACTUAL SUMMON MECHANIC").
     THE RIG     each pose is cut into three rigid chunks at two rows found in his own silhouette: the
                 NECK (the narrowest row after the head's widest, in the top third) and the WAIST (the
                 narrowest row between the neck and the feet). Measured per pose, so a pose re-rigs itself.
     THE BREATH  the torso is STRETCHED, not moved — drawn `rise` rows taller, pinned at the waist — so the
                 feet stay planted and the head rides up on top. Bobbing translates; breathing stretches.
     THE DRIVER  mostly still: a spring pulls the lean back to centre, and every few seconds a random shove.
                 The head leans furthest, the legs least. One clock, kept across poses, so a new pose
                 continues the same breath. TWELVE frames a second, as the original ran.
     THE POSES   orv/orv2.json, the one Orv (never redrawn): pose f holds orvBeat[f] ms. Poses 2 and 3 carry
                 the sparks off the raised claw as his own pixels ('!' '@'); nothing here draws a spark.
                 Every pose stands on the same row (THE FEET ON THE GROUND, 09-15).
     LISTENING   words in the box, or Orv reading: he holds pose 2, a little livelier (OrvSummon2's mood).
     Reduced motion: one still frame. Tap = send (Day One's portal: words in the box go; none, the box opens). */
const ORV = { listening: () => false, scale: () => KNOBS.orvScale, repaint: () => {} };
function orvRig(rows) {
  const h = rows.length;
  const width = rows.map(r => { let lo = 1e9, hi = -1; for (let x = 0; x < r.length; x++) if (r[x] !== '.') { if (x < lo) lo = x; if (x > hi) hi = x; } return hi < 0 ? 0 : hi - lo + 1; });
  const top = Math.max(1, Math.round(h * 0.34));
  let headMax = 0, headAt = 0;
  for (let y = 0; y < top; y++) if (width[y] > headMax) { headMax = width[y]; headAt = y; }
  let neckY = headAt + 1, narrow = 1e9;
  for (let y = headAt + 1; y < Math.round(h * 0.5); y++) if (width[y] > 0 && width[y] < narrow) { narrow = width[y]; neckY = y; }
  const footTop = h - Math.max(3, Math.round(h * 0.13));
  let waistY = Math.round((neckY + h) / 2); narrow = 1e9;
  for (let y = neckY + 2; y < footTop - 2; y++) if (width[y] > 0 && width[y] < narrow) { narrow = width[y]; waistY = y; }
  return { neckY, footTop, legTop: Math.max(neckY + 2, Math.min(waistY, footTop - 2)) };
}
async function orvBoot() {
  const cv = $('orvCv');
  let O;
  try { O = await (await fetch(KNOBS.orvSprite)).json(); } catch (e) { return; }
  const R = KNOBS.summon, w = O.w, h = O.h, BEAT = KNOBS.orvBeat;
  let S = ORV.scale();                                              // integer scale; the look may change it (the one Orv, never redrawn)
  const lowest = rows => { for (let y = rows.length - 1; y >= 0; y--) if (/[^.]/.test(rows[y])) return y; return rows.length - 1; };
  const floor = Math.max.apply(null, O.frames.map(lowest));
  const poses = O.frames.map(raw => {
    const drop = floor - lowest(raw);                                 // the feet on the ground
    const rows = drop > 0 ? Array(drop).fill('.'.repeat(w)).concat(raw.slice(0, raw.length - drop)) : raw;
    const src = document.createElement('canvas'); src.width = w; src.height = h;   // baked once, one art pixel a canvas pixel
    const sx = src.getContext('2d'), img = sx.createImageData(w, h);
    rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) {
      const hx = O.pal[row[x]]; if (!hx) continue;
      const n = parseInt(hx.slice(1), 16), o = (y * w + x) * 4;
      img.data[o] = (n >> 16) & 255; img.data[o + 1] = (n >> 8) & 255; img.data[o + 2] = n & 255; img.data[o + 3] = 255;
    } });
    sx.putImageData(img, 0, 0);
    return { src, rig: orvRig(rows) };
  });
  const ctx = cv.getContext('2d');
  const size = () => {
    cv.width = (w + R.mx * 2) * S; cv.height = (h + R.my) * S;
    cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
    document.documentElement.style.setProperty('--orv-w', cv.width + 'px'); document.documentElement.style.setProperty('--orv-h', cv.height + 'px');
    ctx.imageSmoothingEnabled = false;
  };
  size();
  const d = { sx: 0, vx: 0, clk: 0, next: 2.0 };
  let f = 0;
  const cl = (v, m) => Math.max(-m, Math.min(m, v));
  const drive = (dt, E) => {
    d.clk += dt;
    const k = 5 + E * 6;
    d.vx += -d.sx * k * dt; d.vx *= 0.89 - E * 0.07; d.sx += d.vx * dt;
    if (d.clk > d.next) {                                             // the shove: never the same way twice
      d.vx += (Math.random() < 0.5 ? -1 : 1) * ((0.4 + E * 0.6) + Math.random() * (2.4 + E * 2.6));
      d.next = d.clk + (1.5 - E * 1.2) + Math.random() * (6.0 - E * 4.8);
    }
  };
  const paint = (p, E) => {
    const { src, rig } = poses[p], { neckY, legTop, footTop } = rig, bHz = 0.20 + E * 0.55;
    const rise = Math.round((0.5 + 0.5 * Math.sin(d.clk * Math.PI * 2 * bHz)) * (2.3 + E * 1.6));
    const swayT = Math.round(cl(d.sx * (1.6 + E * 0.9), 3 + E * 1.5));
    const swayH = swayT + Math.round(cl(d.sx * (0.5 + E * 0.3), 1.5));
    const swayLeg = Math.round(swayT * 0.45), X = R.mx * S, Y = R.my * S;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(src, 0, neckY, w, legTop - neckY, X + swayT * S, Y + neckY * S - rise * S, w * S, (legTop - neckY) * S + rise * S);   // the torso, drawn taller, pinned at the waist
    ctx.drawImage(src, 0, legTop, w, footTop - legTop, X + swayLeg * S, Y + legTop * S, w * S, (footTop - legTop) * S);               // the legs, leaning a little
    ctx.drawImage(src, 0, footTop, w, h - footTop, X, Y + footTop * S, w * S, (h - footTop) * S);                                      // the feet, planted
    ctx.drawImage(src, 0, 0, w, neckY + 1, X + swayH * S, Y - rise * S, w * S, (neckY + 1) * S);                                       // the head, riding on top
    cv.dataset.pose = String(p);
  };
  const rescale = () => { const s = ORV.scale(); if (s === S) return false; S = s; size(); return true; };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    paint(0, R.energy[0]);
    ORV.repaint = () => { rescale(); paint(0, R.energy[0]); };
    return;
  }
  /* the pose clock is its own (OrvSummon2: setTimeout(BEAT[f])); a new pose is painted at once, the rig ticks at 12 fps */
  let last = 0, timer = 0, was = null, fresh = true;
  ORV.repaint = () => { rescale(); fresh = true; };
  const arm = () => { clearTimeout(timer); timer = setTimeout(() => { f = (f + 1) % poses.length; fresh = true; arm(); }, BEAT[f % BEAT.length]); };
  const loop = ts => {
    const t = ts / 1000, held = ORV.listening(), E = R.energy[held ? 1 : 0];
    if (held !== was) { was = held; if (held) clearTimeout(timer); else arm(); fresh = true; }   // speaking/listening: hold the claw, nothing more
    if (t - last >= 1 / R.fps) { last = t; drive(1 / R.fps, E); fresh = true; }
    if (fresh) { fresh = false; paint(held ? R.hold : f, E); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

    st.tasks.forEach(k => { const i = k.after.indexOf(t.id); if (i < 0) return;

/* the reply: the whole of it as JSON, else the first balanced {…}; null when nothing parses */

/* Orv's system words: INK's hot context (the seed verbatim first, then his state lines), the ids, the rule */
function orvSystem(st) {
  const order = storyOrder(st), one = theOne(st);
  const open = order.filter(t => !t.done && t !== one), done = order.filter(t => t.done);
  const hot = INK.hotContext({ name: KNOBS.me.carrying, tasks: (one ? [one] : []).concat(open, done), words: '' });
  let ids = '';
  for (const t of (one ? [one] : []).concat(open, done.slice().reverse())) {
    const bit = t.id + ' ' + t.word + (t.done ? ' (done)' : t === one ? ' (the one thing)' : '');
    if (ids.length + bit.length + 3 > KNOBS.me.idsMax) break;
    ids += (ids ? ' · ' : '') + bit;
  }
  const next = [1, 2, 3, 4].map(k => 't' + (st.n + k).toString(36)).join(', ') + '…';
  const gn = Number.isSafeInteger(st.gn) ? st.gn : 0, gnext = [1, 2, 3].map(k => 'g' + (gn + k).toString(36)).join(', ') + '…';
  /* the groups: the state of the kingdom, each with the words of its living tasks */
  let groups = '';
  for (const g of groupsOf(st)) {
    const words = order.filter(t => t.group === g.id).map(t => t.word + (t.done ? ' (done)' : ''));
    const bit = g.id + ' ' + g.word + (g.text ? ': ' + clip(g.text, 60) : '') + (words.length ? ' [' + words.join(', ') + ']' : '');
    if (groups.length + bit.length + 3 > KNOBS.me.groupsChars) break;
    groups += (groups ? ' · ' : '') + bit;
  }
  const lines = [hot, 'Groups: ' + (groups || 'none yet'), 'Task ids: ' + (ids || 'none yet')];
  const g = ME.group && groupById(st, ME.group);
  if (g) lines.push('He is looking at the group ' + g.word + (g.text ? ' (' + clip(g.text, 80) + ')' : '') + '.');
  const thread = talkLines(KNOBS.me.talkChars);
  if (thread) lines.push('The talk so far (he closes it with "many thanks"):\n' + thread);
  const set = settings();
  lines.push({ immersive: 'Story meter: immersive. Speak from inside his world: the kingdom, the court, the quest.',
               balanced: 'Story meter: balanced. A touch of the story, mostly plain words.',
               focus: 'Story meter: focus. Plain words only, no story, no metaphor. Short.' }[set.meter] || '');
  lines.push({ advice: 'Mode: advice. Advise him; any ops you give wait until he says "many thanks".',
               answer: 'Mode: answer. Answer what he asks; any ops you give wait until he says "many thanks".',
               action: 'Mode: action. Your ops change his kingdom now.' }[set.mode] || '');
  lines.push(KNOBS.me.rule.replace('{next}', next).replace('{gnext}', gnext));

}
/* the talk on the glass, oldest first, as plain lines for Orv to reread; the newest lines win the room */

    if (s.length > room) break;

/* one call through a door. opts.json (default true): ask for JSON where the door has a JSON mode; opts.tokens: room */

/* ── THE TALK: his lines and Orv's stay on the glass (ink.me.talk) until "many thanks" folds them away; the log

function talkPush(who, text, stage) {

/* Orv's words into the corner. opts.thread:false = not kept in the talk (a boot line, the bow);

/* his unsent words survive a reload, a crash, a phone that puts the tab to sleep: kept under ink.me.draft as he

/* he speaks: his words go on the log FIRST, verbatim; only then is a door knocked on.
   The modules hear him next ('speak'); one may take the words whole (ev.stop()). With no decide module, the plain
   look phrases ("darker", "Orv bigger", "put it back") move the glass here, at $0, and no door is knocked on.
   "many thanks" closes the talk: Orv answers whatever else was said, then the ritual. */
async function meSpeak(source) {
  if (ME.busy) return;
  const ta = $('meWords'), raw = ta.value;
  if (!raw.trim()) { ta.focus(); return; }
  if (keyShaped(raw.trim())) {                                    // a key pasted into the talk: it goes to its box, never into the log
    ta.value = '';
    const r = setKey(raw.trim());
    meSay(r.ok ? keySaid(r) : '(Orv squints at the key: ' + r.why + '.)', true, { thread: false });
    return meRender();
  }
  if (!logIt({ who: 'k', what: 'say', text: raw })) { meSay('(The glass is full. Your words stay in the box.)', true, { thread: false }); return meRender(); }
  ta.value = ''; draftKeep();
  ME.stick = true;                                                // he spoke: the talk goes back to its foot
  ME.note = '';
  const system = orvSystem(ME.st);                                // the talk as it stood before these words; they go as his turn
  talkPush('k', raw);
  if (raw.indexOf(KNOBS.password) >= 0) openPaid();
  const thanks = KNOBS.me.thanks.test(raw);
  const rest = raw.replace(new RegExp(KNOBS.me.thanks.source, 'ig'), ' ').replace(new RegExp(KNOBS.password, 'g'), ' ');
  const ev = { text: raw, source: typeof source === 'string' ? source : 'box', thanks, stopped: false, stop() { ev.stopped = true; } };
  emit('speak', ev);

/* ── A WORD OPENS AT THE WORD (the Sword's law: sword.js tell(), Scriptorium tell.js): TAP a word and its
   information unfolds right under it, one step deeper and one size smaller, and everything below moves
   down to make room; TAP it again and it folds, and everything moves back. One word open at a time; the
   word tapped stays where it was under the finger. A star tapped in the sky opens its word in the sword. ── */
function unfold(t, lineShown) {
  const all = live(ME.st), named = list => list.map(x => x.word).join(' · ');
  const before = named(t.after.map(a => all.find(x => x.id === a)).filter(Boolean));
  const then = named(all.filter(x => x.after.includes(t.id)));
  const u = mk('div', 'unfold');
  if (!lineShown) u.appendChild(mk('p', 'full', t.text));
  if (before) u.appendChild(mk('p', 'line', 'after ' + before));
  if (then) u.appendChild(mk('p', 'line', 'then ' + then));
  const g = t.group && groupById(ME.st, t.group);
  if (g) u.appendChild(mk('p', 'line', 'in ' + g.word));
  u.appendChild(mk('p', 'line', 'made ' + when(t.at) + (t.done && t.doneAt ? ' · done ' + when(t.doneAt) : '')));
  u.addEventListener('click', () => meTap(t.id));
  return u;
}

    orvHold = { x, y, t: setTimeout(() => { orvHold = null; ME.orvHeld = Date.now(); emit('hold-orv', { x, y }); }, KNOBS.me.holdMs) };
  });
  const orvLetGo = e => { if (!orvHold) return; if (e.type === 'pointermove' && Math.hypot(e.clientX - orvHold.x, e.clientY - orvHold.y) < KNOBS.me.holdSlop) return; clearTimeout(orvHold.t); orvHold = null; };
  ['pointerup', 'pointercancel', 'pointermove'].forEach(t => $('orv').addEventListener(t, orvLetGo));
  /* personal mode: his hand on the sword, the sky, the shelf */
  $('meWords').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); meSpeak(); } });
  $('meWords').addEventListener('input', draftSoon);
  addEventListener('pagehide', () => { if (DRAFT) draftKeep(); });
  /* the talk: his hand scrolling back up it lets go of the foot; back at the foot, it holds there again. Whatever
     changes the corner's room (a module's words, the key line, a seam, the glass turning) re-pins it. */
  $('meThread').addEventListener('scroll', () => { const th = $('meThread'); ME.stick = th.scrollTop + th.clientHeight >= th.scrollHeight - 4; }, { passive: true });
  try { const ro = new ResizeObserver(pinSoon); ['meCorner', 'slotChat', 'slotCorner', 'meKey', 'meWords', 'meFoot'].forEach(id => ro.observe($(id))); } catch (e) { /* no observer: every draw still pins */ }
  $('guard').addEventListener('click', () => { if ($('guard').dataset.id) meTap($('guard').dataset.id, $('guard')); });
  $('plus').addEventListener('click', () => editBegin(null));
  /* his hand on a word or a star: tap · swipe · hold · drag (one state machine, pointer events) */
  const sword = $('sword'), me = $('me');
  sword.addEventListener('pointerdown', swDown);
  $('meSky').addEventListener('pointerdown', swDown);
  addEventListener('pointermove', swMove, { passive: false });
  addEventListener('pointerup', swUp); addEventListener('pointercancel', swUp);
  addEventListener('touchmove', e => { if (((SW && SW.mode) || PULL || SEAM) && e.cancelable) e.preventDefault(); }, { passive: false });
  me.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#sword [data-id], #meSky [data-id], .seam, #meTop')) e.preventDefault(); });
  sword.addEventListener('click', e => {                          // a hold's, a swipe's or a drag's own click is not a tap
    if (ME.swiped && Date.now() - ME.swiped < 500) { e.stopPropagation(); e.preventDefault(); ME.swiped = 0; }
  }, true);
  $('meEmptyRestore').addEventListener('click', () => $('meFile').click());
  const sky = $('meSky'), skyTap = e => {                        // INK's own tap would select; here a tap opens the word in the sword
    const g = e.target.closest && e.target.closest('[data-id]');
    e.stopPropagation();
    if (e.type === 'click' && ME.swiped && Date.now() - ME.swiped < 500) { ME.swiped = 0; return; }
    if (g) { if (e.type === 'keydown') e.preventDefault(); tapStar(g.getAttribute('data-id')); }
  };
  sky.addEventListener('click', skyTap, true);
  sky.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') skyTap(e); }, true);
  document.addEventListener('pointerdown', e => {               // a tap anywhere else keeps an edit and puts the shelf away
    const inside = sel => e.target.closest && e.target.closest(sel);
    ME.swiped = 0;                                                // a new press: any click owed to the last gesture has come and gone
    if (ME.edit && !inside('#editor')) editCommit();
    if (!$('meShelf').hidden && !inside('#meShelf') && !inside('#meTop')) $('meShelf').hidden = true;
    if (!$('meShelfList').hidden && !inside('#meShelfList') && !inside('#meShelf')) { $('meShelfList').hidden = true; $('meProjects').setAttribute('aria-expanded', 'false'); }
  }, true);
  /* the seams and the pull */
  ['vseam', 'hseam'].forEach(id => {
    const el = $(id);
    el.addEventListener('pointerdown', seamDown); el.addEventListener('pointermove', seamMove);
    el.addEventListener('pointerup', seamUp); el.addEventListener('pointercancel', seamUp);
    el.addEventListener('keydown', seamKey);
  });
  me.addEventListener('pointerdown', pullDown);
  addEventListener('pointermove', pullMove, { passive: false });
  addEventListener('pointerup', pullUp); addEventListener('pointercancel', pullUp);
  $('meTop').addEventListener('click', e => { if (ME.swiped && Date.now() - ME.swiped < 500) { e.stopPropagation(); e.preventDefault(); ME.swiped = 0; } }, true);
  $('meNudge').addEventListener('click', meKeep);
  $('meKeySave').addEventListener('click', () => {
    const k = $('meKeyIn').value.trim();
    if (!k) return $('meKeyIn').focus();
    const r = setKey(k);                                          // the stamp names the door: Orv's chat box, or the decide slot (Jev)
    if (!r.ok) return meNote(r.why);
    $('meKeyIn').value = '';
    meSay(keySaid(r), true);
    meRender();
  });
  $('meProjects').addEventListener('click', () => {
    const l = $('meShelfList'), open = l.hidden;
    if (open) meShelf();
    l.hidden = !open; $('meProjects').setAttribute('aria-expanded', String(open));
    shelfUsed();
  });
  $('meKeep').addEventListener('click', () => { shelfUsed(); meKeep(); });
  $('meRestore').addEventListener('click', () => { shelfUsed(); $('meFile').click(); });
  $('meFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) meRestore(f); });
  addEventListener('resize', () => { if (ME.on) { swHome(); seamsApply(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (ME.on) fitGuard(); });
  seamWords();
  $('sendBtn').addEventListener('click', sendWords);
  $('pasteBtn').addEventListener('click', async () => { await readPasted($('pasteIn').value, $('pasteNote')); $('pasteIn').value = ''; });
  orvBoot();

  /* the hash: an invite (#ink=) or a message (#m=). Read once, then wiped from the address bar —
     an invite holds keys and should not sit in the history. */
  /* #seed= plants his kingdom (only into an empty one). No invite and no message: HIS KINGDOM (§12). */
  /* #say=<words> comes from the "Tell Orv" Shortcut (Siri, the Lock Screen control, the Action button):
     the words land in his kingdom as if typed, and Orv answers. */
  if (!/^#(ink|m)=/.test(location.hash)) showMode(true);          // his glass at once (his name, Orv) while the modules arrive
  await Promise.race([modulesP, new Promise(r => setTimeout(r, KNOBS.modulesWaitMs))]);   // the modules hear the first render
  let got = null, seed = null, said = null;
  if (location.hash.length > 1) {
    const sm = /^#seed=([A-Za-z0-9_-]+)$/.exec(location.hash);
    const sy = /^#say=(.*)$/s.exec(location.hash);
    if (sm) seed = sm[1];
    else if (sy) { try { said = decodeURIComponent(sy[1].replace(/\+/g, ' ')); } catch (e) { said = null; } }
    else got = await INK.readLink(location.hash);
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (got && got.ink && !adopt(got.ink)) got = null;
  const booted = () => { BOOTED = { mode: ME.on ? 'personal' : 'project', modules: ORVAPP.modules.slice() }; emit('boot', BOOTED); };
  if (got && got.ink) { enter(got.ink.p); booted(); }
  else if (got && got.m && projects().length) { enter(projects()[0]); await takeBody(got.m); booted(); }
  else { await meEnter(seed); booted(); if (said && said.trim()) await sayFromOutside(said); }
  modulesP.then(() => { if (BOOTED) BOOTED.modules = ORVAPP.modules.slice(); });   // a module slower than the wait still hears 'boot' (on() replays it)
  if (!ME.on) track.scrollLeft = track.clientWidth;
  /* the glass already open when the "Tell Orv" Shortcut (or a seed link) arrives: a hash-only change does not
     reload the page, so the words are taken here, the same way as at boot */
  addEventListener('hashchange', async () => {
    const sm = /^#seed=([A-Za-z0-9_-]+)$/.exec(location.hash), sy = /^#say=(.*)$/s.exec(location.hash);
    if (!sm && !sy) return;
    history.replaceState(null, '', location.pathname + location.search);
    if (sm) return meEnter(sm[1]);
    let words = null; try { words = decodeURIComponent(sy[1].replace(/\+/g, ' ')); } catch (e) { words = null; }
    if (!words || !words.trim()) return;
    await sayFromOutside(words);
  });
  setInterval(resendDue, KNOBS.resendCheckMs);
  setInterval(renderRoad, KNOBS.roadMs);
}
boot();
</script>
