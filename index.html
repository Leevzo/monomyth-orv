<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Orv">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#454545">
<title>Orv</title>
<link rel="manifest" href="./orv.webmanifest?v=2">
<link rel="apple-touch-icon" href="./icon.png?v=true1">
<link rel="stylesheet" href="./fonts.css">
<!--
  ORV — the whole app, bare bones (the King, 2026-10-01 morning):
  "Orv in the corner of the screen, the one thing in the upper left-hand corner with some fun visual details like
   counting down time if there's a timed thing coming up ... nothing has to come up and cover anything ... a to-do
   list and I can type to him and he'll answer back with a conversational message ... one line on the bottom ...
   the words on their own, very colorful when selected, floating to the right, timed against the left-hand side with
   a number on the most left-hand side of the entire screen ... listing my ideas, running the numbers and ordering my
   tasks by priority. That's the whole app."

  How it works, all of it:
  - The list lives on this phone: localStorage 'orv.state' {v, tasks:[{id, word, text, at, done, doneAt, gone}], one, n}.
    The order of tasks IS the priority. Every word he types is kept first, verbatim, in 'orv.log' (append-only).
  - He types on the bottom line. Orv answers through the key box (the same box the Sword uses,
    'monomyth.focus.byok.v1'); the model returns {say, ops}; this page checks every op and applies only the good ones.
  - A key typed on the line is kept as the key (never sent to a model). A paid door waits for the word Cha-ching.
  - "many thanks" clears the talk (the log keeps it). #say=<words> (the Tell Orv Shortcut) arrives as if typed.
  - Tap a word: it lights in colour, floats right and shows its line. Swipe right = done. Swipe left = set aside.
  Nothing pops up. Nothing covers anything.
-->
<style>
:root {
  --ground: #454545; --ink: #f2f2f2; --dim: #a9a9a9; --faint: #6e6e6e; --gold: #FFA512; --late: #FF3D12;
  --pad: 18px; --orv: 123px; --orvh: 156px; --word: 22px; --small: 13px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); overflow: hidden;
  font-family: 'W95FA', ui-monospace, monospace; -webkit-font-smoothing: none; font-smooth: never; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 14px) var(--pad) calc(env(safe-area-inset-bottom) + 10px) 8px; }
/* THE ONE THING, upper left */
#one { padding-left: 4px; min-height: 64px; }
#oneWord { font-family: 'Dogica', ui-monospace, monospace; font-size: 30px; line-height: 38px; color: var(--gold); word-break: break-word; }
#oneLine { font-size: var(--small); color: var(--dim); margin-top: 2px; }
/* the countdown to the next scheduled thing: big digits like the camp app, no borders, no lines */
#clock { margin-top: 8px; min-height: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#clock .digits { font-family: 'Dogica', ui-monospace, monospace; font-size: 26px; letter-spacing: .04em; line-height: 1.1; }
#clock .what { font-size: var(--small); color: var(--dim); }
/* the middle: the list | the divider (his name) | Orv's side */
#main { flex: 1 1 auto; min-height: 0; display: flex; margin-top: 14px; }
#left { flex: 0 0 var(--d, 58%); width: var(--d, 58%); min-width: 0; display: flex; flex-direction: column; }
/* the list: numbers on the very left edge, times beside them, the words floating free */
#list { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding-bottom: 8px; touch-action: pan-y; }
/* the divider is only a word: "inkling", faint, in the middle of the screen. Drag the word. */
#div { flex: 0 0 0px; position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
/* INKLING, sideways, like the SCRIPTORIUM spine: faint at rest, lit in the twelve colours under the finger */
#star { position: absolute; left: 0; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); padding: 10px 14px; cursor: col-resize; touch-action: none;
  font-family: 'Dogica', ui-monospace, monospace; font-size: 17px; letter-spacing: .3em; color: var(--ink); opacity: .16; white-space: nowrap; transition: opacity .25s; }
#star.lit { opacity: 1; }
#app.open #star { opacity: .32; }
#app.action #star { opacity: .5; color: var(--gold); }
#right { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: calc(var(--orvh) - 36px); }
#talk { flex: 1 1 auto; overflow-y: auto; display: none; padding: 0 2px 8px 6px; }
#app.open #talk { display: block; }
#app.action #right { display: none; }
#mode { display: none; }
.row { display: grid; grid-template-columns: 22px 46px 1fr; align-items: baseline; min-height: 40px; padding: 4px 0;
  user-select: none; -webkit-user-select: none; touch-action: pan-y; }
.num { font-family: 'Dogica', ui-monospace, monospace; font-size: 11px; color: var(--faint); text-align: left; }
.at { font-size: var(--small); color: var(--dim); }
.at.late { color: var(--late); }
.word { font-size: var(--word); transition: none; }
.row.sel .word { transform: translateX(28px); }
.row.sel .line { display: block; }
.line { display: none; grid-column: 3; font-size: var(--small); color: var(--dim); transform: translateX(28px); margin-top: 2px; }
.row.done .word { color: var(--faint); text-decoration: line-through; }
.row.is-one .word { color: var(--gold); }
#bottom { padding-right: calc(var(--orv) + 4px); }
#say { font-size: 16px; line-height: 1.35; max-height: 40vh; overflow-y: auto; padding: 0 2px 6px 6px; white-space: pre-wrap; }
#say.stage { color: var(--dim); font-style: italic; }
#line { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: transparent; border: 0;
  border-bottom: 1px solid var(--faint); padding: 8px 2px 8px 4px; outline: none; border-radius: 0; }
#line::placeholder { color: var(--faint); }
#orv { position: fixed; right: calc(var(--pad) - 6px); bottom: calc(env(safe-area-inset-bottom) + 8px); width: var(--orv); height: var(--orvh); image-rendering: pixelated; cursor: pointer; }
#talk .k { color: var(--dim); font-size: 15px; margin: 14px 0 4px; white-space: pre-wrap; }
#talk .o { font-size: 16px; line-height: 1.35; margin: 0 0 4px; white-space: pre-wrap; }
#talk .sum { color: var(--gold); font-size: 14px; margin: 10px 0 18px; }
#keep { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: calc(var(--pad) + 62px); font-size: var(--small);
  color: var(--faint); background: none; border: 0; padding: 6px; font-family: inherit; }
#flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
/* DOUBLE-TAP ORV: the meter, story ↔ focus. A slider, nothing else. */
#meter { position: fixed; z-index: 12; left: 18px; right: 18px; bottom: calc(env(safe-area-inset-bottom) + var(--orvh) + 22px); padding: 18px 6px 10px; background: var(--ground); }
#meter[hidden] { display: none; }
#meterTrack { position: relative; height: 34px; touch-action: none; cursor: pointer; }
#meterTrack::before { content: ''; position: absolute; left: 0; right: 0; top: 16px; height: 2px; background: var(--faint); }
#meterKnob { position: absolute; top: 7px; width: 20px; height: 20px; margin-left: -10px; background: var(--gold); }
#meterWords { display: flex; justify-content: space-between; font-size: 15px; color: var(--dim); margin-top: 4px; }
#meterWords b { font-weight: normal; color: var(--gold); }
#meterSays { font-size: var(--small); color: var(--faint); margin-top: 8px; min-height: 1.3em; }
/* HOLD ORV: he listens; the words appear as they are heard */
#hear { position: fixed; z-index: 12; left: 14px; right: calc(var(--orv) + 18px); bottom: calc(env(safe-area-inset-bottom) + 70px);
  font-size: clamp(20px, 6vw, 28px); line-height: 1.3; color: var(--ink); white-space: pre-wrap; pointer-events: none; }
#hear[hidden] { display: none; }
#hear i { color: var(--dim); font-style: normal; }
#hear .dot { color: var(--late); }
/* THE SALMON OF KNOWLEDGE: the settings live behind him, top right */
#salmon { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top) + 10px); right: calc(var(--pad) - 4px); image-rendering: pixelated; cursor: pointer; padding: 6px; }
#salmon.call { animation: swim 1.1s steps(2) infinite; }
@keyframes swim { 50% { transform: translateX(-4px); } }
@media (prefers-reduced-motion: reduce) { #salmon.call { animation: none; } }
#set { position: fixed; inset: 0; z-index: 15; background: var(--ground); overflow-y: auto; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 58px) 22px calc(env(safe-area-inset-bottom) + 18px); }
#set h2 { font-family: 'Dogica', ui-monospace, monospace; font-weight: normal; font-size: clamp(26px, 8vw, 40px); color: var(--gold); margin: 0; }
#setBody { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: space-evenly; gap: 22px; padding: 26px 0 18px; }
.sl { display: flex; flex-direction: column; gap: 4px; margin: 0; }
.sl > span { font-size: 15px; letter-spacing: .06em; color: var(--dim); }
.sl textarea, .sl input { width: 100%; min-width: 0; font: inherit; font-size: clamp(19px, 5.6vw, 26px); line-height: 1.3; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--faint); border-radius: 0; padding: 8px 2px 10px; outline: none; resize: none; overflow: hidden;
  word-break: break-all; -webkit-appearance: none; }
.sl textarea:focus, .sl input:focus { border-bottom-color: var(--ink); }
.sl textarea::placeholder, .sl input::placeholder { color: var(--faint); }
#setTest { align-self: flex-start; font: inherit; font-size: clamp(22px, 6.4vw, 30px); color: var(--gold); background: none; border: 0; padding: 6px 0; cursor: pointer; }
#setSay { min-height: 4.2em; font-size: clamp(16px, 4.6vw, 21px); line-height: 1.4; color: var(--dim); white-space: pre-wrap; }
#setSay.bad { color: var(--late); } #setSay.good { color: var(--gold); }
#setDiag { font-size: 13px; line-height: 1.55; color: var(--faint); white-space: pre-wrap; }
body.setting #app, body.setting #orv, body.setting #keep { visibility: hidden; }
.sl[hidden], #set[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .row.sel .word, .line { transform: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="one"><div id="oneWord"></div><div id="oneLine"></div><div id="clock"></div></div>
  <div id="main">
    <div id="left"><div id="list" aria-label="your list, in order of priority"></div></div>
    <div id="div" role="separator" aria-label="drag: far left shows your words, far right is action mode"></div>
    <div id="right"><div id="talk" aria-label="the whole talk"><div id="chatLog"></div></div><div id="say"></div><div id="mode"></div></div>
  </div>
  <div id="bottom"><input id="line" autocomplete="off" autocapitalize="sentences" placeholder="tell orv" aria-label="tell Orv"></div>
</div>
<canvas id="orv" aria-label="Orv. Tap to send, double-tap for story or focus, hold to talk."></canvas>
<div id="meter" hidden><div id="meterTrack" role="slider" aria-label="story or focus" aria-valuemin="0" aria-valuemax="100"><div id="meterKnob"></div></div>
  <div id="meterWords"><span id="mwStory">story</span><span id="mwFocus">focus</span></div><div id="meterSays"></div></div>
<div id="hear" hidden aria-live="polite"></div>
<button id="keep" aria-label="keep a copy of the list">keep</button>
<input id="restore" type="file" accept="application/json,.json" hidden>
<div id="flash"></div>
<canvas id="salmon" role="button" tabindex="0" aria-label="settings (the salmon of knowledge)"></canvas>
<div id="set" hidden role="dialog" aria-label="settings">
  <h2>settings</h2>
  <div id="setBody">
  <label class="sl"><span>key</span><textarea id="setKey" rows="1" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="paste your key" aria-label="your key"></textarea></label>
  <label class="sl" id="setChaRow" hidden><span>coin</span><input id="setCha" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Cha-ching" aria-label="the word that lets Orv spend"></label>
  <label class="sl"><span>model</span><input id="setModel" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="chosen for you" aria-label="the model Orv thinks with"></label>
  <button id="setTest" type="button">test</button>
  <div id="setSay" aria-live="polite"></div>
  </div>
  <div id="setDiag"></div>
</div>
<script>
'use strict';
/* ═══ KNOBS: every tunable value, for his eye ═══ */
const K = {
  wheel: ['#FF7A12', '#FF12A1', '#FA12FF', '#9212FF', '#2A12FF', '#126EFF', '#12D6FF', '#12FFC2', '#12FF5A', '#22FF12', '#8AFF12', '#F2FF12'],
  seed: 'You are Orv, the teasing one-eyed homunculus and Hand. Read before speaking. Surface shapes, don\'t invent. Guide the King to write. Tease him.',
  freeDoors: ['groq', 'gemini', 'openrouter'], password: 'Cha-ching',
  swipe: 70, orvScale: 3, beat: [1400, 520, 130, 190], fps: 12, memory: 6, maxOps: 12, timeoutMs: 120000
};
const BOX = 'monomyth.focus.byok.v1';
const DOORS = {
  groq:       { list: 'https://api.groq.com/openai/v1/models', chat: 'https://api.groq.com/openai/v1/chat/completions' },
  openrouter: { list: 'https://openrouter.ai/api/v1/models', chat: 'https://openrouter.ai/api/v1/chat/completions' },
  xai:        { list: 'https://api.x.ai/v1/models', chat: 'https://api.x.ai/v1/chat/completions' },
  openai:     { list: 'https://api.openai.com/v1/models', chat: 'https://api.openai.com/v1/chat/completions' },
  anthropic:  { list: 'https://api.anthropic.com/v1/models?limit=100', chat: 'https://api.anthropic.com/v1/messages' },
  gemini:     { list: 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', chat: 'https://generativelanguage.googleapis.com/v1beta/models/' }
};
const $ = id => document.getElementById(id);
const nowIso = () => new Date().toISOString();

/* ═══ STORAGE: his list and his words, on this phone ═══ */
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
/* THE SPARE: every write is copied into IndexedDB too. If the phone ever drops localStorage (the key, the list),
   the page finds it empty on open, pours the spare back in and reloads once. */
const SPARE = { db: null, t: 0,
  open() { return this.db || (this.db = new Promise((ok, no) => { try { const r = indexedDB.open('orv-spare', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } })); },
  snap() { const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k === BOX || k.startsWith('orv.')) o[k] = localStorage.getItem(k); } } catch (e) {} return o; },
  save() { clearTimeout(this.t); this.t = setTimeout(async () => { try { const db = await this.open(), o = this.snap();
    if (!Object.keys(o).length) return; db.transaction('s', 'readwrite').objectStore('s').put(o, 'all'); } catch (e) {} }, 300); },
  async get() { try { const db = await this.open(); return await new Promise(ok => { const r = db.transaction('s').objectStore('s').get('all'); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); }); } catch (e) { return null; } }
};
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); SPARE.save(); return true; } catch (e) { try { say('(This phone would not keep that. Tap keep to save a copy.)', true); } catch (x) {} return false; } };
function blank() { return { v: 1, tasks: [], one: null, n: 0 }; }
/* #new: a new kingdom. Whatever was here is set aside (kept under orv.archive.<time>, never deleted). */
if (location.hash === '#new') {
  const was = load('orv.state', null);
  if (was) store('orv.archive.' + Date.now(), { state: was, log: load('orv.log', []) });
  ['orv.state', 'orv.log', 'orv.chat', 'orv.summary', 'orv.breath'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  history.replaceState(null, '', location.pathname + location.search);
}
/* every open is counted, so a phone that forgets everything shows itself (opens stuck at 1) */
const OPENS = (load('orv.opens', 0) || 0) + 1; store('orv.opens', OPENS);
let ST = load('orv.state', null);
if (!ST || !Array.isArray(ST.tasks)) { ST = blank(); store('orv.state', ST); }
/* ask the phone to keep this kingdom for good (Safari honours it for sites he uses) */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
function log(e) { const L = load('orv.log', []); L.push(Object.assign({ at: nowIso() }, e)); store('orv.log', L); }
const save = () => store('orv.state', ST);
const live = () => ST.tasks.filter(t => !t.gone);
const open = () => live().filter(t => !t.done);
const byId = id => ST.tasks.find(t => t.id === id && !t.gone);
function theOne() { const o = byId(ST.one); return o && !o.done ? o : open()[0] || null; }

/* ═══ THE KEY BOX (the Sword's own shape: apiKey) ═══ */
const box = () => load(BOX, {}) || {};
const doorOf = k => { k = String(k || '').trim();
  if (k.startsWith('gsk_')) return 'groq'; if (k.startsWith('sk-ant-')) return 'anthropic'; if (k.startsWith('sk-or-')) return 'openrouter';
  if (k.startsWith('xai-')) return 'xai'; if (k.startsWith('AIza')) return 'gemini'; if (k.startsWith('sk-')) return 'openai'; return null; };
const keyDoor = () => { const b = box(); return b.door || doorOf(b.apiKey); };
const looksLikeKey = s => /^(gsk_|sk-ant-|sk-or-|xai-|AIza|sk-)[\w-]{16,}$/.test(String(s).trim());
const paidOpen = d => K.freeDoors.includes(d) || !!(load('orv.paid', {})[d]);

/* ═══ DRAWING ═══ */
function fmtAt(at) { const d = new Date(at); if (isNaN(d)) return ''; let h = d.getHours(), m = d.getMinutes(), p = h < 12 ? 'a' : 'p'; h = h % 12 || 12;
  const today = new Date().toDateString() === d.toDateString();
  return (today ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + h + (m ? ':' + String(m).padStart(2, '0') : '') + p; }
function rainbow(el, text) { el.textContent = ''; Array.from(text).forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.color = K.wheel[i % K.wheel.length]; el.appendChild(s); }); }
let SEL = null;
function render() {
  const one = theOne();
  $('oneWord').textContent = one ? one.word : (ST.tasks.length ? 'clear' : 'tell orv');
  $('oneLine').textContent = one ? one.text : (ST.tasks.length ? 'every task is done' : 'what does the day hold?');
  const L = $('list'); L.textContent = '';
  const rows = open().concat(live().filter(t => t.done));
  rows.forEach((t, i) => {
    const r = document.createElement('div'); r.className = 'row' + (t.done ? ' done' : '') + (one && t.id === one.id ? ' is-one' : '') + (t.id === SEL ? ' sel' : '');
    r.dataset.id = t.id;
    const n = document.createElement('span'); n.className = 'num'; n.textContent = t.done ? '' : String(i + 1);
    const a = document.createElement('span'); a.className = 'at'; a.textContent = t.at ? fmtAt(t.at) : '';
    if (t.at && !t.done && new Date(t.at) < new Date()) a.classList.add('late');
    const w = document.createElement('span'); w.className = 'word';
    if (t.id === SEL) rainbow(w, t.word); else w.textContent = t.word;
    const l = document.createElement('span'); l.className = 'line'; l.textContent = t.text || '';
    r.append(n, a, w, l); L.appendChild(r);
  });
  tick();
}
/* the clock: a countdown to THE ONE THING if it is timed, else to the next timed task; the digits wheel through colour */
function span(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function tick() {
  const c = $('clock'), one = theOne(), now = Date.now();
  const timed = open().filter(t => t.at && !isNaN(new Date(t.at))).sort((a, b) => new Date(a.at) - new Date(b.at));
  const next = timed.find(x => new Date(x.at) > now);                       // the next thing scheduled
  const t = one && one.at && new Date(one.at) <= now ? one : next;          // the one thing gone late outranks it
  c.textContent = ''; if (!t) return;
  const ms = new Date(t.at) - now, late = ms < 0, txt = span(Math.abs(ms));
  const d = document.createElement('span'); d.className = 'digits';
  Array.from(txt).forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch;
    s.style.color = late ? 'var(--late)' : /\d/.test(ch) ? K.wheel[(i + Math.floor(now / 1000)) % K.wheel.length] : 'var(--dim)'; d.appendChild(s); });
  const w = document.createElement('span'); w.className = 'what';
  w.textContent = late ? (t === one ? 'late' : t.word + ' is late') : 'until ' + (t === one ? 'it starts' : t.word) + ' · ' + fmtAt(t.at);
  c.append(d, w);
}
setInterval(tick, 1000);

/* ═══ TOUCH: tap = light it and float it right; swipe right = done; swipe left = set aside ═══ */
(function touch() {
  let row = null, x0 = 0, y0 = 0, dx = 0, lock = null;
  const L = $('list');
  L.addEventListener('pointerdown', e => { row = e.target.closest('.row'); if (!row) return; x0 = e.clientX; y0 = e.clientY; dx = 0; lock = null; });
  L.addEventListener('pointermove', e => { if (!row) return; const mx = e.clientX - x0, my = e.clientY - y0;
    if (!lock && (Math.abs(mx) > 10 || Math.abs(my) > 10)) lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    if (lock === 'x') { dx = mx; row.querySelector('.word').style.transform = 'translateX(' + dx + 'px)'; } });
  const end = () => { if (!row) return; const t = byId(row.dataset.id), w = row.querySelector('.word'); w.style.transform = '';
    if (lock === 'x' && t && Math.abs(dx) > K.swipe) {
      if (dx > 0) { t.done = !t.done; t.doneAt = t.done ? nowIso() : null; log({ who: 'k', what: t.done ? 'done' : 'undone', id: t.id }); }

    HEARD = fin; HEAR_LIVE = live; hearShow(); };
  REC.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') say('(Orv cannot hear you: the phone said no to the microphone. Settings → Apps → Safari → Microphone.)', true); };
  REC.onend = () => { if (REC && REC._held) try { REC.start(); } catch (e) {} };   // Safari stops on pauses; keep listening while held
  REC._held = true; hearShow();
  try { REC.start(); } catch (e) { return false; }
  return true;
}
function listenStop() {
  if (!REC) return; const r = REC; REC = null; r._held = false; ORV.listening = false;
  setTimeout(() => { try { r.stop(); } catch (e) {}
    setTimeout(() => { const words = (HEARD + ' ' + HEAR_LIVE).replace(/\s+/g, ' ').trim(); $('hear').hidden = true;
      if (words) { log({ who: 'k', what: 'voice', text: words }); speak(words); } }, 600); }, 250);
}
(function hands() {
  const O = $('orv'); let holdT = 0, held = false, lastTap = 0, tapT = 0, x0 = 0, y0 = 0;
  O.addEventListener('contextmenu', e => e.preventDefault());
  O.style.webkitTouchCallout = 'none'; O.style.userSelect = 'none'; O.style.touchAction = 'none';
  O.addEventListener('pointerdown', e => { held = false; x0 = e.clientX; y0 = e.clientY;
    holdT = setTimeout(() => { held = true; clearTimeout(tapT); lastTap = 0; listenStart(); }, 420); });
  O.addEventListener('pointermove', e => { if (!held && Math.hypot(e.clientX - x0, e.clientY - y0) > 12) clearTimeout(holdT); });
  const up = () => { clearTimeout(holdT);
    if (held) { held = false; listenStop(); return; }
    const now = Date.now();
    if (now - lastTap < 320) { clearTimeout(tapT); lastTap = 0; meterToggle(); return; }   // double-tap
    lastTap = now;
    tapT = setTimeout(() => { lastTap = 0; if ($('line').value.trim()) speak($('line').value); else $('line').focus(); }, 320); };
  O.addEventListener('pointerup', up); O.addEventListener('pointercancel', () => { clearTimeout(holdT); if (held) { held = false; listenStop(); } });
})();

/* ═══ KEEP / RESTORE: a copy of the list as a file (hold keep to restore) ═══ */
(function keep() {
  let t = 0, held = false;
  $('keep').addEventListener('pointerdown', () => { held = false; t = setTimeout(() => { held = true; $('restore').click(); }, 700); });
  $('keep').addEventListener('pointerup', async () => { clearTimeout(t); if (held) return;
    const name = 'orv-' + new Date().toISOString().slice(0, 10) + '.json', blob = new Blob([JSON.stringify({ state: ST, log: load('orv.log', []) })], { type: 'application/json' });
    const file = new File([blob], name, { type: 'application/json' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) { return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); });
  $('restore').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return;
    try { const o = JSON.parse(await f.text()); if (o && o.state && Array.isArray(o.state.tasks)) { ST = o.state; save(); log({ who: 'k', what: 'restored', text: f.name }); render(); say('Restored from ' + f.name + '.', true); } }
    catch (x) { say('(That file would not open.)', true); } });
})();

/* ═══ ORV, SUMMONED: his own idle rig (Summon.tsx via OrvSummon2), the one Orv, never redrawn ═══ */
const ORV = { listening: false };
(async function orvBoot() {
  const cv = $('orv'); let O; try { O = await (await fetch('./orv/orv2.json')).json(); } catch (e) { return; }
  const w = O.w, h = O.h, S = K.orvScale, mx = 5, my = 4;
  const lowest = rows => { for (let y = rows.length - 1; y >= 0; y--) if (/[^.]/.test(rows[y])) return y; return rows.length - 1; };
  const floor = Math.max.apply(null, O.frames.map(lowest));
  const rig = rows => { const width = rows.map(r => { let lo = 1e9, hi = -1; for (let x = 0; x < r.length; x++) if (r[x] !== '.') { lo = Math.min(lo, x); hi = Math.max(hi, x); } return hi < 0 ? 0 : hi - lo + 1; });
    const top = Math.max(1, Math.round(h * .34)); let hm = 0, ha = 0; for (let y = 0; y < top; y++) if (width[y] > hm) { hm = width[y]; ha = y; }
    let neck = ha + 1, n = 1e9; for (let y = ha + 1; y < Math.round(h * .5); y++) if (width[y] > 0 && width[y] < n) { n = width[y]; neck = y; }
    const foot = h - Math.max(3, Math.round(h * .13)); let waist = Math.round((neck + h) / 2); n = 1e9;
    for (let y = neck + 2; y < foot - 2; y++) if (width[y] > 0 && width[y] < n) { n = width[y]; waist = y; }
    return { neck, foot, leg: Math.max(neck + 2, Math.min(waist, foot - 2)) }; };
  const poses = O.frames.map(raw => { const drop = floor - lowest(raw); const rows = drop > 0 ? Array(drop).fill('.'.repeat(w)).concat(raw.slice(0, raw.length - drop)) : raw;
    const src = document.createElement('canvas'); src.width = w; src.height = h; const sx = src.getContext('2d'), img = sx.createImageData(w, h);
    rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const hx = O.pal[row[x]]; if (!hx) continue; const v = parseInt(hx.slice(1), 16), o = (y * w + x) * 4;
      img.data[o] = (v >> 16) & 255; img.data[o + 1] = (v >> 8) & 255; img.data[o + 2] = v & 255; img.data[o + 3] = 255; } });
    sx.putImageData(img, 0, 0); return { src, r: rig(rows) }; });
  cv.width = (w + mx * 2) * S; cv.height = (h + my) * S; cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const d = { sx: 0, vx: 0, clk: 0, next: 2 }; let f = 0, last = 0, timer = 0;
  const cl = (v, m) => Math.max(-m, Math.min(m, v));
  const paint = (p, E) => { const { src, r } = poses[p], rise = Math.round((.5 + .5 * Math.sin(d.clk * Math.PI * 2 * (.2 + E * .55))) * (2.3 + E * 1.6));
    const st = Math.round(cl(d.sx * (1.6 + E * .9), 3 + E * 1.5)), sh = st + Math.round(cl(d.sx * (.5 + E * .3), 1.5)), sl = Math.round(st * .45), X = mx * S, Y = my * S;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(src, 0, r.neck, w, r.leg - r.neck, X + st * S, Y + r.neck * S - rise * S, w * S, (r.leg - r.neck) * S + rise * S);
    ctx.drawImage(src, 0, r.leg, w, r.foot - r.leg, X + sl * S, Y + r.leg * S, w * S, (r.foot - r.leg) * S);
    ctx.drawImage(src, 0, r.foot, w, h - r.foot, X, Y + r.foot * S, w * S, (h - r.foot) * S);
    ctx.drawImage(src, 0, 0, w, r.neck + 1, X + sh * S, Y - rise * S, w * S, (r.neck + 1) * S); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { paint(0, .34); return; }
  const arm = () => { clearTimeout(timer); timer = setTimeout(() => { f = (f + 1) % poses.length; arm(); }, K.beat[f % K.beat.length]); }; arm();
  const loop = ts => { const t = ts / 1000, E = ORV.listening ? .42 : .34;
    if (t - last >= 1 / K.fps) { last = t; d.clk += 1 / K.fps; d.vx += -d.sx * (5 + E * 6) / K.fps; d.vx *= .89 - E * .07; d.sx += d.vx / K.fps;
      if (d.clk > d.next) { d.vx += (Math.random() < .5 ? -1 : 1) * ((.4 + E * .6) + Math.random() * (2.4 + E * 2.6)); d.next = d.clk + (1.5 - E * 1.2) + Math.random() * (6 - E * 4.8); }
      paint(ORV.listening ? 2 : f, E); }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();

/* ═══ THE DIVIDER: his name, vertical. It follows the hand 1:1 and holds where let go.
   All the way left: his own lines appear and scroll. All the way right: action mode, Orv acts and does not answer.
   Double-tap: back to the middle. ═══ */
let MODE = 'talk';
(function divider() {
  const D = $('div'), A = $('app'), M = $('main');
  D.innerHTML = '<span id="star" aria-hidden="true">inkling</span>';   // his symbol comes later; for now, the word, faint
  const STAR = $('star');
  const WORD = 'INKLING'; STAR.textContent = '';
  Array.from(WORD).forEach(ch => { const x = document.createElement('span'); x.textContent = ch; STAR.appendChild(x); });
  let dark = 0;
  const light = () => { clearTimeout(dark); STAR.classList.add('lit'); Array.from(STAR.children).forEach((x, i) => { x.style.color = K.wheel[(i * 2) % K.wheel.length]; }); };
  const unlight = () => { clearTimeout(dark); dark = setTimeout(() => { STAR.classList.remove('lit'); Array.from(STAR.children).forEach(x => { x.style.color = ''; }); }, 900); };
  STAR.addEventListener('pointerdown', light); ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => STAR.addEventListener(t, unlight));
  const KD = { dflt: 0.58, left: 0.16, right: 0.86, min: 0.06, max: 0.94 };
  const setD = (f, keep) => { f = Math.max(KD.min, Math.min(KD.max, f)); A.style.setProperty('--d', (f * 100).toFixed(2) + '%');
    const was = MODE; MODE = f >= KD.right ? 'action' : 'talk'; A.classList.toggle('open', f <= KD.left); A.classList.toggle('action', MODE === 'action');
    $('mode').textContent = MODE === 'action' ? 'ACTION' : ''; if (A.classList.contains('open')) drawChat();
    if (keep) store('orv.d', f); };
  setD(load('orv.d', KD.dflt), false);
  let drag = false, x0 = 0, f0 = 0, lastTap = 0;
  STAR.addEventListener('pointerdown', e => { drag = true; x0 = e.clientX; const r = M.getBoundingClientRect(); f0 = (D.getBoundingClientRect().left - r.left) / r.width; STAR.setPointerCapture(e.pointerId); });
  STAR.addEventListener('pointermove', e => { if (!drag) return; const r = M.getBoundingClientRect(); setD(f0 + (e.clientX - x0) / r.width, false); });
  STAR.addEventListener('pointerup', e => { if (!drag) return; drag = false; const r = M.getBoundingClientRect(), f = f0 + (e.clientX - x0) / r.width;
    const t = Date.now(); if (Math.abs(e.clientX - x0) < 4 && t - lastTap < 350) { setD(KD.dflt, true); lastTap = 0; return; } lastTap = t; setD(f, true); });
})();

/* ═══ BOOT: #say= from the Tell Orv Shortcut arrives as if typed ═══ */
render();
function fromHash() { const m = /^#say=(.*)$/s.exec(location.hash); if (!m) return; let w = ''; try { w = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { w = ''; }
  history.replaceState(null, '', location.pathname + location.search); if (w.trim()) speak(w); }
fromHash(); window.addEventListener('hashchange', fromHash);
drawChat();
/* ═══ SETTINGS, behind the Salmon of Knowledge (top right). Minimal lines: key · coin (paid doors only) · model.
   The key box grows with the letters. "test" asks the doors for their model lists (free) to find whose key it is,
   keeps it, reads it back to prove the phone kept it, then asks Orv one short real question so you SEE him answer.
   The app never blocks on a key screen: with no key it opens anyway and the salmon swims until it is fed. ═══ */
const TRY = ['gemini', 'groq', 'openrouter', 'anthropic', 'openai', 'xai'];
let SET_BUSY = false;
const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
function setSay(t, how) { const s = $('setSay'); s.textContent = t || ''; s.classList.toggle('bad', how === 'bad'); s.classList.toggle('good', how === 'good'); }
function setDiag() {
  const app = (navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? 'the Home Screen app' : 'a Safari tab';
  const kat = load('orv.keyAt', null), d = keyDoor();
  $('setDiag').textContent = 'key kept: ' + (box().apiKey ? (d || '?') + (kat ? ' since ' + fmtAt(kat) : '') : 'none') +
    '\nopens this phone remembers: ' + OPENS + (OPENS === 1 ? '  (if this stays 1 every time, the phone is wiping Orv)' : '') +
    '\nopened as ' + app + ' · ' + location.pathname;
}
function setFill() {
  const k = String(box().apiKey || ''), d = keyDoor();
  if (document.activeElement !== $('setKey')) $('setKey').value = k;
  $('setModel').value = d ? String((load('orv.model', {}) || {})[d] || '') : '';
  $('setChaRow').hidden = !(d && !paidOpen(d));
  grow($('setKey')); setDiag();
}
function setOpen(why, bad) {
  document.body.classList.add('setting'); $('set').hidden = false; $('salmon').classList.remove('call');
  setFill(); setSay(why || '', bad ? 'bad' : '');
  if (!box().apiKey) setTimeout(() => $('setKey').focus(), 60);
}
function setClose() {
  $('set').hidden = true; document.body.classList.remove('setting'); salmonCall();
  const k = box().apiKey, d = keyDoor();
  if (k && d && paidOpen(d) && $('line').value.trim()) { const w = $('line').value; speak(w); }
}
function salmonCall() { const d = keyDoor(); $('salmon').classList.toggle('call', !box().apiKey || !d || !paidOpen(d)); }
async function setTest() {
  if (SET_BUSY) return;
  const v = $('setKey').value.replace(/\s+/g, '');
  if (!v) { setSay('Paste your key on the key line first.', 'bad'); return $('setKey').focus(); }
  SET_BUSY = true; $('setTest').textContent = 'testing…'; setSay('asking the doors whose key this is…');
  try {
    const guess = doorOf(v), order = guess ? [guess].concat(TRY.filter(x => x !== guess)) : TRY;
    let door = null, firstWhy = '';
    for (const d of order) {
      try { const r = await fetchT(DOORS[d].list, { headers: headers(d, v) }); const o = await r.json().catch(() => ({}));
        if (r.ok) { door = d; break; } if (!firstWhy) firstWhy = doorError(r, o).message;
      } catch (e) { if (!firstWhy) firstWhy = e.name === 'AbortError' ? 'no answer in time' : String(e.message || e); }
    }
    if (!door) { log({ who: 'k', what: 'key refused', text: firstWhy }); return setSay('✗ No door took that key.\n' + String(firstWhy).slice(0, 200), 'bad'); }
    const was = box().apiKey;
    const b = box(); b.apiKey = v; b.door = door; store(BOX, b); store('orv.keyAt', nowIso()); log({ who: 'k', what: 'key', door });
    if (box().apiKey !== v) return setSay('✗ The key works, but this phone refused to keep it.\nIn Settings → Apps → Safari, turn off "Block All Cookies", and do not use a Private tab.', 'bad');
    if (was !== v) { const kept = load('orv.model', {}); delete kept[door]; store('orv.model', kept); }
    setFill();
    if (!paidOpen(door)) return setSay('✓ The key works (' + door + ') and this phone kept it.\nIt costs money: type ' + K.password + ' on the coin line, then test again.', 'good');
    setSay('✓ ' + door + ' took the key and this phone kept it. Now asking Orv one short question…', 'good');
    const t0 = performance.now();
    const { m, text } = await answer(door, v, K.seed + '\nThis is a test of the line. Answer ONLY with the JSON object {"say": "<one short sentence to the High King, in your voice, saying you hear him>", "ops": []}.', [{ role: 'user', content: 'Orv, can you hear me?' }]);
    let r = null; try { r = JSON.parse(text); } catch (e) { const j = /\{[\s\S]*\}/.exec(text); if (j) try { r = JSON.parse(j[0]); } catch (e2) { r = null; } }
    const heard = (r && r.say) ? String(r.say) : String(text || '').slice(0, 200);
    setFill();
    setSay('✓ Works. ' + door + ' · ' + m + ' · ' + ((performance.now() - t0) / 1000).toFixed(1) + 's\nOrv: ' + heard, 'good');
    log({ who: 'k', what: 'tested', door, model: m });
    setTimeout(() => { if ($('set').hidden) return; setClose();               // plug and play: tested, so straight into the app
      if (!$('line').value.trim()) typeSay(FIRST && !open().length ? '(Orv rubs his claws together.) Your first Breath, High King. Tell me everything that is alive in you today, every road you are on. I will make the list.' : '(Orv blinks his one eye.) Talk to me.', true);
      setTimeout(() => $('line').focus(), 100); }, 2200);
  } catch (e) {
    setSay('✗ The key is kept, but Orv could not get through: ' + plainWhy(e), 'bad');
  } finally { SET_BUSY = false; $('setTest').textContent = 'test'; setDiag(); salmonCall(); }
}
$('setTest').addEventListener('click', setTest);
$('setKey').addEventListener('input', () => grow($('setKey')));
$('setKey').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setTest(); } });
$('setCha').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('setCha').blur(); } });
$('setCha').addEventListener('change', () => {
  const w = $('setCha').value.trim(), d = keyDoor(); if (!w || !d) return;
  if (w.toLowerCase() !== K.password.toLowerCase()) return setSay('That is not the word. Type ' + K.password + '.', 'bad');
  const p = load('orv.paid', {}); p[d] = nowIso(); store('orv.paid', p); log({ who: 'k', what: 'cha-ching', door: d });
  $('setCha').value = ''; setFill(); setTest();
});
$('setModel').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('setModel').blur(); } });
$('setModel').addEventListener('change', async () => {
  const want = $('setModel').value.trim(), k = String(box().apiKey || ''), d = keyDoor(); if (!k || !d) return;
  const kept = load('orv.model', {});
  if (!want) { delete kept[d]; store('orv.model', kept); return setSay('Orv will choose the model himself.'); }
  try { const o = await (await fetchT(DOORS[d].list, { headers: headers(d, k) })).json();
    const ids = d === 'gemini' ? (o.models || []).map(x => String(x.name).replace(/^models\//, '')) : (o.data || []).map(x => String(x.id));
    const hit = ids.find(id => id.toLowerCase() === want.toLowerCase()) || ids.find(id => id.toLowerCase().includes(want.toLowerCase()));
    if (!hit) return setSay('The ' + d + ' door has no model like "' + want + '".', 'bad');
    kept[d] = hit; store('orv.model', kept); $('setModel').value = hit; setSay('Orv now thinks with ' + hit + '. Tap test to hear him.', 'good');
  } catch (e) { setSay('The door would not list its models: ' + plainWhy(e), 'bad'); }
});
/* the salmon himself: true pixels, drawn from a map, never smoothed */
(function salmon() {
  const MAP = [
    '.......ooooo........',
    '.....oodddddoo....oo',
    '...oodddddddddo..odo',
    '..odwedddkddddoooddo',
    '.osssssssssssssssddo',
    '..olllllssssssooosdo',
    '...oollllllsso...oso',
    '.....ooooooo......oo',
  ];
  const PAL = { o: '#3a1f2b', d: '#e0605a', s: '#fa8072', l: '#ffd0bf', w: '#ffffff', e: '#141733', k: '#b8473f' };
  const S = 4, c = $('salmon'), x = c.getContext('2d');
  c.width = MAP[0].length * S; c.height = MAP.length * S; c.style.width = c.width + 'px'; c.style.height = c.height + 'px';
  MAP.forEach((row, y) => Array.from(row).forEach((ch, i) => { if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i * S, y * S, S, S); } }));
  const tog = () => $('set').hidden ? setOpen() : setClose();
  c.addEventListener('click', tog);
  c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } });
})();

const HAD = box().apiKey, HAD_D = keyDoor();
salmonCall();
if (!HAD || !HAD_D) { (async () => {                   // the key is gone from localStorage: is it in the spare?
  const sp = await SPARE.get(); let again = false; try { again = sessionStorage.getItem('orv.poured') === '1'; } catch (e) {}
  if (sp && sp[BOX] && !again) { try { Object.keys(sp).forEach(k => localStorage.setItem(k, sp[k])); sessionStorage.setItem('orv.poured', '1'); } catch (e) { return; }
    location.reload(); return; }
  setOpen('Paste your key and tap test. A Groq or Gemini key is free.');
})(); }
else if (!paidOpen(HAD_D)) typeSay('(Orv points at the salmon.) The ' + HAD_D + ' key costs money. Type ' + K.password + ' on the coin line in there.', true);
else if (FIRST && !open().length) typeSay('(Orv rubs his claws together.) Your first Breath, High King. Tell me everything that is alive in you today, every road you are on. I will make the list.', true);
else if (load('orv.summary', '')) say(load('orv.summary', ''));
</script>
